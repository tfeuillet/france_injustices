<html lang="fr">

<link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css">
<style>
  :root { --accent: #8c3b1c; --gris: #666; --fond: #f6f4ef; --trait: #ddd; }
  * { box-sizing: border-box; }
  body { margin: 0; font: 14px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; color: #222; background: #fff; }
  header { display: flex; align-items: center; gap: 16px; padding: 10px 18px; border-bottom: 1px solid var(--trait); flex-wrap: wrap; }
  header h1 { font: 600 22px/1.2 Georgia, serif; margin: 0; flex: 1; }
  header button, header a.bouton { font: inherit; padding: 6px 12px; border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 4px; cursor: pointer; text-decoration: none; }
  header button.actif { background: var(--accent); color: #fff; }
  header .export { font-size: 13px; color: var(--gris); }
  header .export button { padding: 3px 8px; font-size: 13px; }
  main { display: flex; height: calc(100vh - var(--haut-entete, 58px)); }
  #zone { position: relative; flex: 1; }
  #carte { position: absolute; inset: 0; background: #fafafa; }
  #encart { position: absolute; top: 12px; right: 12px; width: 230px; height: 190px; border: 1px solid #999; z-index: 500; background: #fafafa; box-shadow: 0 1px 4px rgba(0,0,0,.2); }
  #encart .titre { position: absolute; top: 2px; left: 6px; z-index: 1000; font-size: 11px; background: rgba(255,255,255,.8); padding: 0 3px; pointer-events: none; }
  #legende { position: absolute; right: 12px; bottom: 24px; z-index: 500; background: rgba(255,255,255,.93); padding: 8px 10px; border-radius: 4px; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.15); max-width: 250px; }
  #legende .barre { display: flex; height: 12px; margin: 4px 0 2px; }
  #legende .barre span { flex: 1; }
  #legende .barre.grille { height: 22px; margin: 1px 0 3px; }
  #legende .barre.grille span { font-size: 10.5px; line-height: 22px; text-align: center; }
  table.croise td { padding: 3px 5px; }
  #legende .bornes { display: flex; justify-content: space-between; color: var(--gris); }
  /* la fiche passe au-dessus du cartouche et de la légende ; trop longue, elle défile */
  #fiche { position: absolute; left: 56px; top: 12px; z-index: 600; background: rgba(255,255,255,.97); padding: 8px 10px; border-radius: 4px; font-size: 12px; box-shadow: 0 1px 4px rgba(0,0,0,.15); max-width: 330px; max-height: calc(100% - 24px); overflow-y: auto; display: none; }
  #fiche.epinglee { box-shadow: 0 1px 6px rgba(0,0,0,.35); padding-right: 26px; }
  #fiche .visage { float: right; margin: -2px 0 2px 6px; cursor: help; }
  #fiche .jauge { float: right; position: relative; width: 72px; height: 9px; margin: 4px 2px 2px 12px; border-radius: 5px; cursor: help; }
  #fiche .jauge i { position: absolute; top: -4px; width: 4px; height: 17px; background: #222; border: 1px solid #fff; border-radius: 2px; transform: translateX(-50%); }
  #fiche .fermer { position: absolute; top: 3px; right: 5px; border: 0; background: none; font-size: 17px; line-height: 1; cursor: pointer; color: #666; padding: 2px 4px; }
  #fiche .fermer:hover { color: #000; }
  #fiche > b:first-of-type { font-size: 1.17em; }   /* nom du territoire */
  #fiche .exporter-fiche { margin-top: 6px; text-align: right; }
  #fiche .exporter-fiche .lien { font-size: 12px; }
  #fiche table { border-collapse: collapse; margin-top: 4px; }
  #fiche td { padding: 1px 6px 1px 0; vertical-align: top; }
  #fiche td.n { text-align: right; white-space: nowrap; }
  #cartouche { position: absolute; left: 12px; bottom: 24px; z-index: 500; background: rgba(255,255,255,.93); padding: 6px 9px; font-size: 11px; line-height: 1.35; border-radius: 4px; max-width: 360px; }
  #cartouche a { color: inherit; }
  aside { width: 380px; overflow-y: auto; border-left: 1px solid var(--trait); padding: 12px 16px 30px; }
  aside h2 { font-size: 13px; text-transform: uppercase; letter-spacing: .04em; color: var(--accent); margin: 18px 0 6px; }
  aside select { width: 100%; font: inherit; padding: 4px; }
  .echelle label { margin-right: 14px; cursor: pointer; white-space: nowrap; display: inline-block; }
  .dimension { margin: 10px 0 4px; padding: 6px 8px 4px; border-left: 3px solid var(--trait); }
  .dimension.active { border-left-color: var(--accent); }
  .dimension .titre-dim { font-weight: 600; font-size: 13.5px; }
  .dimension label { display: block; cursor: pointer; padding: 1px 0; }
  .dimension input { accent-color: var(--accent); margin-right: 6px; }
  .dimension .i { cursor: help; color: var(--accent); font-size: 12px; margin-left: 4px; }
  .dimension .aide { font-size: 12px; color: var(--gris); margin: 0 0 4px 22px; }
  .refs li { margin-bottom: 4px; }
  .alerte { background: #fff4e5; border-left: 3px solid #e08a00; padding: 6px 8px; font-size: 12.5px; margin: 8px 0; }
  .lien { color: var(--accent); cursor: pointer; text-decoration: underline; font-size: 13px; }
  table.qui { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.villes { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  table.villes td { padding: 3px 4px; border-bottom: 1px solid #eee; }
  table.villes td.n { text-align: right; white-space: nowrap; color: #444; }
  table.villes tr:hover td { background: #f6f1ea; }
  table.qui th, table.qui td { padding: 4px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
  table.qui th { font-weight: 600; text-align: right; color: var(--gris); }
  table.qui th:first-child, table.qui td:first-child { text-align: left; }
  table.qui td.n { text-align: right; white-space: nowrap; }
  .pire { color: #b2182b; font-weight: 600; }
  .mieux { color: #1a7837; font-weight: 600; }
  .petit { font-size: 12px; color: var(--gris); }
  .avance { margin: -4px 0 10px; font-size: 12.5px; color: var(--gris); }
  details.supp { margin: 6px 0 10px; }
  details.supp summary { cursor: pointer; font-weight: 600; font-size: 13px; color: var(--accent); margin-bottom: 4px; }
  .opacite { border-top: 1px solid #ddd; margin-top: 6px; padding-top: 6px; font-size: 12px; }
  .opacite input { width: 90px; vertical-align: middle; }
  #explications { position: fixed; inset: var(--haut-entete, 58px) 0 0 0; overflow-y: auto; background: var(--fond); z-index: 2000; display: none; }
  #explications .texte { max-width: 900px; margin: 0 auto; padding: 20px 24px 60px; background: #fff; }
  #explications h2 { font: 600 20px Georgia, serif; margin: 28px 0 8px; }
  #explications h3 { font-size: 15px; margin: 18px 0 6px; }
  #explications table { border-collapse: collapse; width: 100%; font-size: 13px; margin: 8px 0; }
  #explications th, #explications td { border-bottom: 1px solid #e4e4e4; padding: 5px 6px; text-align: left; vertical-align: top; }
  #explications a { color: inherit; text-decoration-color: var(--accent); text-underline-offset: 2px; }
  .onglets { display: flex; margin: 4px 0 6px; border-bottom: 1px solid var(--trait); }
  .onglets button { flex: 1; font: inherit; font-size: 13px; padding: 7px 3px; border: none; border-bottom: 3px solid transparent; background: none; cursor: pointer; color: var(--gris); }
  .onglets button.actif { border-bottom-color: var(--accent); color: var(--accent); font-weight: 600; }
  .reglages { display: grid; grid-template-columns: 118px 1fr; gap: 6px 8px; align-items: center; }
  .reglages > span { color: var(--gris); font-size: 13px; }
  .reglages label { cursor: pointer; margin-right: 10px; white-space: nowrap; }
  .reglages input[type=range] { width: 100%; accent-color: var(--accent); }
  .bouton2 { font: inherit; font-size: 13px; padding: 5px 10px; border: 1px solid var(--accent); color: var(--accent); background: #fff; border-radius: 4px; cursor: pointer; margin-top: 8px; }
  .bouton2:disabled { opacity: .5; cursor: default; }
  #etat { font-size: 12.5px; color: var(--gris); min-height: 18px; margin-top: 6px; }
  #etat .barre { height: 4px; background: #eee; margin-top: 3px; }
  #etat .barre i { display: block; height: 100%; background: var(--accent); }
  #resultats table { width: 100%; border-collapse: collapse; font-size: 12.5px; }
  #resultats td { padding: 3px 4px; border-bottom: 1px solid #eee; vertical-align: top; }
  #resultats td.n { text-align: right; white-space: nowrap; }
  #nuage { width: 100%; height: 240px; display: block; margin-top: 6px; }
  #chargement { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; z-index: 3000; background: rgba(255,255,255,.85); font-size: 16px; }
  .seulement-mobile { display: none; }
  /* Téléphone : en-tête compact, carte puis panneau l'un sous l'autre, fiche en bas de la carte */
  @media (max-width: 800px) {
    header { padding: 6px 10px; gap: 6px 8px; }
    header h1 { font-size: 18px; flex-basis: 100%; }
    header .export { display: none; }
    header button, header a.bouton { padding: 3px 8px; font-size: 13px; }
    main { flex-direction: column; height: auto; }
    #zone { height: 62vh; flex: none; }
    aside { width: auto; border-left: none; padding: 8px 12px 30px; }
    #encart { width: 120px; height: 100px; top: 8px; right: 8px; }
    #encart .titre { font-size: 9px; }
    #cartouche { display: none; }
    #legende { right: 6px; bottom: 18px; padding: 4px 6px; font-size: 10.5px; max-width: 160px; }
    #legende .petit, #legende p { display: none; }
    #fiche { left: 6px; right: 6px; top: auto; bottom: 20px; max-width: none; max-height: 48%; overflow-y: auto; font-size: 11.5px; z-index: 900; background: #fff; }
    .seulement-mobile { display: block; }
    .vers-panneau { text-align: center; font-size: 12.5px; color: var(--gris); padding: 6px; border-bottom: 1px solid var(--trait); }
    #explications .texte { padding: 14px 12px 60px; }
    #explications table { font-size: 11.5px; display: block; overflow-x: auto; }
  }
</style>
</head>
<body>
<header>
  <h1>Les injustices territoriales en France</h1>
  <span class="export">Exporter la carte : <button onclick="exporterCarte('png')">PNG</button> <button onclick="exporterCarte('pdf')">PDF</button></span>
  <button id="b-methode" onclick="basculerMethode()">Méthode et sources</button>
  <a class="bouton" id="b-contact" href="#">Proposer une amélioration</a>
</header>
<main>
  <div id="zone">
    <div id="carte"></div>
    <div id="encart"><div class="titre">Paris et petite couronne</div></div>
    <div id="fiche"></div>
    <div id="legende"></div>
    <div id="cartouche"></div>
    <div id="chargement">Chargement des 35 000 communes…</div>
  </div>
  <div class="seulement-mobile vers-panneau">Réglages, classement des villes et explications ci-dessous ↓</div>
  <aside id="panneau"></aside>
</main>
<section id="explications"><div class="texte" id="texte"></div></section>

<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script>
<script src="moteur.js"></script>
<script src="gwr.js"></script>
<script src="lisa.js"></script>
<script src="facteurs.js"></script>
<script src="export.js"></script>
<script>
const AUTEUR = '<a href="https://tfeuillet.github.io/" target="_blank" rel="noopener">Thierry Feuillet</a>, Université de Caen Normandie, <a href="https://umr-idees.fr/" target="_blank" rel="noopener">UMR CNRS IDEES</a>';
const CONTACT = "thierry.feuillet@unicaen.fr";
const DEPOT = "https://github.com/tfeuillet/france_injustices";     // adresse du dépôt GitHub, pour les propositions
// Dix classes de 10 % de la population, du plus favorable (vert) au plus défavorable (rouge)
const COULEURS = ["#006837", "#1a9850", "#66bd63", "#a6d96a", "#d9ef8b", "#fee08b", "#fdae61", "#f46d43", "#d73027", "#a50026"];
const MANQUE = "#d4d4d4";
const CLE_CARTO = "";
let opacite = 1;   // opacité des communes, réglable sur la carte
const CONTOUR = "#8a8a8a";   // contour gris des communes et des intercommunalités   // clé gratuite pour le fond CARTO (facultative, voir plus bas)
const IDF = [[48.68, 2.08], [49.03, 2.63]];
const dateFr = d => /^\d{4}-\d{2}-\d{2}/.test(d) ? d.slice(8, 10) + "/" + d.slice(5, 7) + "/" + d.slice(0, 4) + d.slice(10) : d;
const lien = (url, texte) => `<a href="${url}" target="_blank" rel="noopener">${texte}</a>`;
// Données Adonis de Solagro : diffusées sous conditions (mention, logo, renvoi vers la plateforme
// Adonis). Elles ne figurent que dans la copie locale de la carte (dossier prive/), jamais dans docs/.
const ADONIS = { mention: "Source : Carte Adonis des pesticides, Solagro, 2024", logo: "solagro.png",
  lien: "https://solagro.org/nos-domaines-d-intervention/agroecologie/carte-pesticides-adonis" };

let D, geoCommunes, geoEpci, geo = {}, geoDep = null, carte, encart, couches = {}, cache = {}, U, res, couleurActuelle = () => MANQUE;
let coches = new Set(), vue = "score", echelle = "epci", mode = "cumul", seuilCompte = 0.2;
// Réglages des liens entre indicateurs. k : nombre de voisins (largeur adaptative), propre à chaque échelle ; h : distance en km (largeur fixe)
const VOISINS_MINI = 30;   // en dessous, la GWR suit des variations très locales : on prévient
const LIENS_DEFAUT = { y: "abstention", x: "pauvrete", mesure: "rangs", stat: "r", noyau: "bicarre", adaptatif: true,
  k: { commune: 400, epci: 60, bv: 70, ze: 30 }, h: 40, pop: true, signif: true, autocorr: true, centre: "zero", auto: true };
let liens = JSON.parse(JSON.stringify(LIENS_DEFAUT)), GW = null, palette = null;

// ---------- Mise en forme ----------
// Le niveau géographique affiché, dans les phrases : « une intercommunalité », « son bassin de vie »…
const N = () => NIVEAUX[echelle];
const uneUnite = () => (N().f ? "une " : "un ") + N().un;
const sonUnite = () => (N().f && !/^[aeiouéh]/i.test(N().un) ? "sa " : "son ") + N().un;
const accorde = (masc, fem) => N().f ? fem : masc;
const niveauxDispo = () => Object.keys(NIVEAUX).filter(n => n === "commune" || geo[n]);
const nb = (x, d = 0) => Number.isNaN(x) || x === null || x === undefined ? "–" : x.toLocaleString("fr-FR", { minimumFractionDigits: d, maximumFractionDigits: d });
const indic = id => D.indicateurs.find(ind => ind.id === id);
const couleur = r => Number.isNaN(r) ? MANQUE : COULEURS[Math.min(9, Math.floor(r * 10))];
// Couleur d'un indicateur pour un territoire : celle de son palier pour les indicateurs à paliers, sinon celle de son rang
const couleurInd = (id, i) => PALIERS[id] ? (Number.isNaN(U.valeurs[id][i]) ? MANQUE : PALIERS_COULEURS[id][palier(id, U.valeurs[id][i])]) : couleur(res.rangs[id][i]);
const valeurTexte = (ind, v) => Number.isNaN(v) ? "non renseigné" : nb(v, ind.decimales) + (/^(%|€|µ|mg)/.test(ind.unite) ? " " + ind.unite.split(/[ ,]/)[0] : "");

// ---------- Adresse de la page (pour partager une carte) ----------
function ecrireAdresse() {
  const c = [...coches].join(",");
  const l = liens, lien_ = mode === "liens" ? `&m=liens&l=${[l.y, l.x, l.mesure, l.stat, l.noyau, l.adaptatif ? "a" + l.k[echelle] : "f" + l.h, +l.pop, +l.signif, l.centre, +l.autocorr].join(",")}` : "";
  const lisa_ = mode === "lisa" ? `&m=lisa&a=${ecrireLisa()}` : "";
  const fact_ = mode === "facteurs" ? `&m=facteurs&f=${ecrireFact()}` : "";
  const double_ = mode === "double" ? `&m=double&d=${dp.s},${dp.e},${Math.round(100 * dp.seuil)}` : "";
  history.replaceState(null, "", `#v=${encodeURIComponent(vue)}&e=${echelle}&c=${c}&s=${Math.round(100 * seuilCompte)}${lien_}${lisa_}${fact_}${double_}${avance ? "&x=1" : ""}`);
  const corps = encodeURIComponent(`Bonjour,\n\nÀ propos de la carte ${location.href}\n\n`);
  document.getElementById("b-contact").href = `mailto:${CONTACT}?subject=${encodeURIComponent("Carte des injustices territoriales")}&body=${corps}`;
}
function lireAdresse() {
  const a = Object.fromEntries(location.hash.slice(1).split("&").map(x => x.split("=")));
  if (a.v) { const v = decodeURIComponent(a.v); if (["score", "compte"].includes(v) || indic(v) || DIMENSIONS.some(d => "d:" + d.id === v)) vue = v; }
  if (NIVEAUX[a.e] && (a.e === "commune" || geo[a.e])) echelle = a.e;
  if (a.c !== undefined) coches = new Set(a.c.split(",").filter(id => indic(id) && indic(id).cumul));
  if (a.s && [10, 20, 25, 33].includes(+a.s)) seuilCompte = +a.s / 100;
  if (["liens", "lisa", "facteurs", "double"].includes(a.m)) mode = a.m;
  avance = a.x === "1" || ["liens", "lisa", "facteurs"].includes(mode);
  if (a.d) { const [s_, e_, q_] = decodeURIComponent(a.d).split(","); if (s_) dp.s = s_; if (e_) dp.e = e_; if (q_) dp.seuil = +q_ === 33 ? 1 / 3 : +q_ / 100; }
  if (a.a) lireLisa(decodeURIComponent(a.a));
  if (a.f) lireFact(decodeURIComponent(a.f));
  if (a.l) {
    const v = decodeURIComponent(a.l).split(","), ok = id => id === "score" || indic(id);
    if (ok(v[0])) liens.y = v[0];
    if (ok(v[1])) liens.x = v[1];
    if (["rangs", "valeurs"].includes(v[2])) liens.mesure = v[2];
    if (["r", "b", "t", "r2"].includes(v[3])) liens.stat = v[3];
    if (GWR.NOYAUX[v[4]]) liens.noyau = v[4];
    if (/^[af][0-9.]+$/.test(v[5] || "")) { liens.adaptatif = v[5][0] === "a"; if (liens.adaptatif) liens.k[echelle] = +v[5].slice(1); else liens.h = +v[5].slice(1); liens.auto = false; }
    if (v[6] !== undefined) liens.pop = v[6] === "1";
    if (v[7] !== undefined) liens.signif = v[7] === "1";
    if (["zero", "global"].includes(v[8])) liens.centre = v[8];
    if (v[9] !== undefined) liens.autocorr = v[9] === "1";
  }
}

// ---------- Démarrage ----------
Promise.all(["data/donnees.json", "data/communes.geojson", "data/epci.geojson"].map(f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); })))
  .then(([d, gc, ge]) => {
    D = normaliser(d); geoCommunes = gc; geoEpci = ge; geo = { commune: gc, epci: ge };
    // bassins de vie et zones d'emploi : seulement s'ils figurent dans les données
    const autres = ["bv", "ze"].filter(n => zonesDe(D, n));
    return Promise.all(autres.map(n => fetch(`data/${n}.geojson`).then(r => r.ok ? r.json() : null).catch(() => null)))
      .then(g => { autres.forEach((n, k) => { if (g[k]) geo[n] = g[k]; }); demarrer(); });
  })
  .catch(e => { document.getElementById("chargement").textContent = "Les données n'ont pas pu être chargées (" + e.message + "). Lancer d'abord run.R."; });

function demarrer() {
  coches = new Set(D.indicateurs.filter(ind => ind.cumul && ind.defaut).map(ind => ind.id));
  const ids = D.indicateurs.map(ind => ind.id);
  if (!ids.includes(liens.y)) liens.y = ids.find(id => id !== liens.x) || "score";
  if (!ids.includes(liens.x)) liens.x = ids.find(id => id !== liens.y) || "score";
  if (geo.bv) echelle = "bv";   // niveau par défaut : bassins de vie, s'ils figurent dans les données
  lireAdresse();
  const options = { renderer: L.canvas({ padding: 0.3 }), zoomSnap: 0.25, preferCanvas: true };
  carte = L.map("carte", options).fitBounds([[41.3, -5.2], [51.15, 9.6]]);
  // Fonds de carte, au choix dans le sélecteur en haut à droite. Le Plan IGN (Géoplateforme, licence
  // ouverte) est proposé par défaut ; le relief ombré et le gris clair viennent d'Esri, sans clé.
  // Les noms des villes sont une couche transparente posée au-dessus des communes.
  const osm = '© contributeurs <a href="https://www.openstreetmap.org/copyright">OpenStreetMap</a>';
  const esri = service => `https://server.arcgisonline.com/ArcGIS/rest/services/${service}/MapServer/tile/{z}/{y}/{x}`;
  const ign = "https://data.geopf.fr/wmts?SERVICE=WMTS&REQUEST=GetTile&VERSION=1.0.0&STYLE=normal&TILEMATRIXSET=PM&FORMAT=image/png"
    + "&LAYER=GEOGRAPHICALGRIDSYSTEMS.PLANIGNV2&TILEMATRIX={z}&TILEROW={y}&TILECOL={x}";
  const contours = " · contours IGN, Etalab";
  const fonds = {
    "Plan IGN": L.tileLayer(ign, { attribution: "Fond © IGN" + contours, maxZoom: 18 }),
    "Relief ombré": L.tileLayer(esri("Elevation/World_Hillshade"), { attribution: "Relief © Esri" + contours, maxZoom: 16 }),
    "Gris clair": CLE_CARTO
      ? L.tileLayer("https://basemaps.cartocdn.com/rastertiles/light_nolabels/{z}/{x}/{y}{r}.png?key=" + CLE_CARTO, { attribution: `${osm}, © CARTO` + contours, maxZoom: 14 })
      : L.tileLayer(esri("Canvas/World_Light_Gray_Base"), { attribution: `Fond © Esri, HERE, Garmin, ${osm}` + contours, maxZoom: 16 }),
    "Aucun": L.layerGroup()
  };
  fonds["Plan IGN"].addTo(carte);
  carte.createPane("etiquettes");
  carte.getPane("etiquettes").style.zIndex = 450;            // au-dessus des communes (400), sous les infobulles
  carte.getPane("etiquettes").style.pointerEvents = "none";   // les clics passent aux communes
  const noms = L.tileLayer(esri("Canvas/World_Light_Gray_Reference"), { pane: "etiquettes", attribution: "Noms © Esri", maxZoom: 16 }).addTo(carte);
  const couchesFond = L.control.layers(fonds, { "Noms des villes": noms }, { position: "topleft" }).addTo(carte);
  // Opacité des communes, dans le menu des fonds : en dessous de 100 %, le fond transparaît (le relief, par exemple)
  const reglage = L.DomUtil.create("div", "opacite");
  reglage.innerHTML = `<label title="Opacité des communes">Opacité <input type="range" min="0.3" max="1" step="0.05" value="1"></label>`;
  reglage.querySelector("input").oninput = e => { opacite = +e.target.value; for (const n of niveauxDispo()) couches[n] && couches[n].setStyle({ fillOpacity: opacite }); };
  couchesFond.getContainer().querySelector(".leaflet-control-layers-list").appendChild(reglage);
  encart = L.map("encart", { renderer: L.canvas(), zoomControl: false, attributionControl: false, dragging: false, scrollWheelZoom: false,
    doubleClickZoom: false, boxZoom: false, keyboard: false, touchZoom: false }).fitBounds(IDF);
  encart.on("click", () => carte.flyToBounds(encart.getBounds()));
  const dansIDF = i => ["75", "92", "93", "94"].includes(D.communes.dep[i]);
  // Chaque unité a un fin contour gris (un liseré blanc donnait l'impression de trous) ;
  // les limites des départements sont tracées par-dessus, en gris plus foncé.
  const style = { weight: 0.3, color: CONTOUR, opacity: 0.6, fillOpacity: opacite };
  couches.commune = L.geoJSON(geoCommunes, { style }).addTo(carte);
  for (const n of niveauxDispo().filter(n => n !== "commune")) {
    couches[n] = L.geoJSON(geo[n], { style: { ...style, weight: 0.5, opacity: 0.8 } });
    couches[n + "Encart"] = L.geoJSON(geo[n], { style: { ...style, weight: 0.5, opacity: 0.8 } });
    const rang = new Map(zonesDe(D, n).code.map((c, k) => [c, k]));
    for (const nom of [n, n + "Encart"]) couches[nom].eachLayer(l => l.indice = rang.get(l.feature.properties.code));
  }
  couches.communeEncart = L.geoJSON({ type: "FeatureCollection", features: geoCommunes.features.filter(f => dansIDF(f.properties.i)) }, { style: { ...style, weight: 0.4 } }).addTo(encart);
  if (couches.communeEncart.getLayers().length) encart.fitBounds(couches.communeEncart.getBounds(), { padding: [4, 4] });
  fetch("data/departements.geojson").then(r => r.ok ? r.json() : null).then(g => {
    if (!g) return;
    geoDep = g;
    const trait = { color: "#3c3c3c", weight: 0.8, opacity: 0.55, interactive: false };
    couches.dep = [L.geoJSON(g, { style: trait, interactive: false }).addTo(carte), L.geoJSON(g, { style: trait, interactive: false }).addTo(encart)];
  }).catch(() => {});
  for (const nom of ["commune", "communeEncart"]) couches[nom].eachLayer(l => l.indice = l.feature.properties.i);
  for (const nom in couches) {
    const trait = couches[nom].options.style.weight;
    couches[nom].trait = trait;
    // survol : fiche provisoire, sauf si une fiche est épinglée
    couches[nom].on("mouseover", e => { if (epingle || TACTILE) return; montrer(e.layer.indice, e.layer);
      document.getElementById("fiche").insertAdjacentHTML("beforeend", `<div class="petit" style="margin-top:4px;color:#888">Cliquer pour garder la fiche ouverte</div>`); });
    couches[nom].on("mouseout", e => { if (epingle || TACTILE) return; document.getElementById("fiche").style.display = "none";
      e.layer.setStyle({ weight: trait, color: CONTOUR }); if (mode === "liens") dessinerNuage(); if (mode === "lisa") dessinerMoran(); });
    // clic : la fiche reste affichée ; un second clic sur le même territoire la libère
    couches[nom].on("click", e => {
      L.DomEvent.stopPropagation(e);
      const meme = epingle && epingle.layer === e.layer;
      liberer();
      if (!meme && e.layer.indice !== undefined) { epingle = { i: e.layer.indice, layer: e.layer, echelle }; montrerEpingle(); }
    });
  }
  carte.on("click", liberer); encart.on("click", liberer);
  L.DomEvent.disableClickPropagation(document.getElementById("fiche"));
  L.DomEvent.disableScrollPropagation(document.getElementById("fiche"));
  document.getElementById("chargement").style.display = "none";
  mettreAJour(true);
}

// ---------- Calcul et dessin ----------
// complet = true : on redessine aussi le panneau (curseurs compris) ; sinon seulement le tableau,
// pour ne pas interrompre un curseur en cours de déplacement.
function mettreAJour(complet) {
  if (!cache[echelle]) cache[echelle] = unites(D, echelle);
  U = cache[echelle];
  res = calculer(D, U, coches, seuilCompte);
  for (const nom of niveauxDispo()) { const actif = nom === echelle; carte[actif ? "addLayer" : "removeLayer"](couches[nom]); encart[actif ? "addLayer" : "removeLayer"](couches[nom + "Encart"]); }
  if (complet) panneau();
  // l'encart de Paris et de la petite couronne ne sert qu'aux communes, trop petites à l'échelle de la France
  document.getElementById("encart").style.display = echelle === "commune" ? "" : "none";
  if (couches.dep) couches.dep.forEach(l => l.bringToFront());
  if (mode === "cumul") {
    document.getElementById("qui").innerHTML = grapheCumul() + tableauQui();
    afficherVilles();
    document.getElementById("lecture").textContent = interpretationCumul();
    document.getElementById("alerte").innerHTML = coches.size ? alerteRedondance()
      : `<div class="alerte">Aucun indicateur n'est coché, le score ne peut pas être calculé. Cochez celui ou ceux que vous voulez cumuler.</div>`;
    const defaut = D.indicateurs.filter(ind => ind.cumul && ind.defaut).map(ind => ind.id).sort().join();
    document.getElementById("revenir").style.display = [...coches].sort().join() !== defaut ? "" : "none";
  } else if (mode === "liens") preparerGWR();
  else if (mode === "lisa") preparerLisa();
  else if (mode === "facteurs") preparerFacteurs();
  colorer(); legende(); cartouche(); ecrireAdresse();
}

function colorer() {
  let f;
  if (mode === "cumul") f = couleursCumul();
  else if (mode === "lisa") f = couleursLisa();
  else if (mode === "facteurs") f = couleursFacteurs();
  else if (mode === "double") f = couleursDouble();
  else f = couleursLiens();
  couleurActuelle = f;
  for (const nom of [echelle, echelle + "Encart"])
    couches[nom].eachLayer(l => l.setStyle({ fillColor: l.indice === undefined ? MANQUE : f(l.indice) }));
  if (epingle) { if (epingle.echelle !== echelle) liberer(); else montrerEpingle(); }
}
// Écran tactile (téléphone, tablette) : pas de survol, la fiche s'ouvre d'un toucher
const TACTILE = matchMedia("(hover: none)").matches;
// Fiche épinglée par un clic : elle suit les changements de réglages jusqu'à ce qu'on la ferme
let epingle = null;
function montrerEpingle() {
  montrer(epingle.i, epingle.layer);
  const f = document.getElementById("fiche");
  f.insertAdjacentHTML("afterbegin", `<button class="fermer" title="Fermer la fiche" onclick="liberer()">×</button>`);
  f.insertAdjacentHTML("beforeend", `<div class="exporter-fiche"><span class="lien" onclick="exporterFiche()">Exporter la fiche (PNG)</span></div>`);
  f.classList.add("epinglee");
}
function liberer() {
  if (!epingle) return;
  const { layer } = epingle; epingle = null;
  for (const nom in couches) if (couches[nom].hasLayer && couches[nom].hasLayer(layer)) layer.setStyle({ weight: couches[nom].trait, color: CONTOUR });
  const f = document.getElementById("fiche"); f.style.display = "none"; f.classList.remove("epinglee");
  if (mode === "liens") dessinerNuage(); if (mode === "lisa") dessinerMoran();
}
function changerMode(m) { mode = m; document.getElementById("fiche").style.display = "none"; mettreAJour(true); }

function cocher(id, oui) { if (oui) coches.add(id); else coches.delete(id); mettreAJour(true); }
// Choisir ce que montre la carte. Pour une dimension, seuls ses indicateurs restent cochés :
// ceux qui l'étaient déjà, ou à défaut ses indicateurs principaux (sinon ses supplémentaires).
const indicateursDim = dim => { const l = D.indicateurs.filter(ind => ind.dimension === dim && ind.cumul); const p = l.filter(ind => !ind.supplementaire); return p.length ? p : l; };
// En revenant au score, on retrouve la sélection d'avant, avec les retouches faites dans la dimension.
let avantDim = null;
function choisirVue(v) {
  const ancienne = vue.startsWith("d:") ? vue.slice(2) : null;
  if (ancienne && avantDim) {
    const ici = D.indicateurs.filter(ind => ind.dimension === ancienne).map(ind => ind.id);
    coches = new Set([...[...avantDim].filter(id => !ici.includes(id)), ...ici.filter(id => coches.has(id))]);
    avantDim = null;
  }
  vue = v;
  if (v.startsWith("d:")) {
    avantDim = new Set(coches);
    const dim = v.slice(2), deja = D.indicateurs.filter(ind => ind.dimension === dim && coches.has(ind.id));
    coches = new Set((deja.length ? deja : indicateursDim(dim)).map(ind => ind.id));
  }
  mettreAJour(true);
}
function toutCocher(oui) { coches = new Set(oui ? D.indicateurs.filter(ind => ind.cumul && !ind.supplementaire).map(ind => ind.id) : []); mettreAJour(true); }
// Analyses avancées : les onglets LISA, GWR et Facteurs n'apparaissent que sur demande
let avance = false;
function basculerAvance(oui) { avance = oui; if (!oui && ["lisa", "liens", "facteurs"].includes(mode)) mode = "cumul"; document.getElementById("fiche").style.display = "none"; mettreAJour(true); }

// Série affichée dans l'onglet du cumul et couleur de chaque territoire
function serieCumul() {
  if (vue === "score") return res.score;
  if (vue === "compte") return res.compte;
  if (vue.startsWith("d:")) return res.rangDim[vue.slice(2)] || new Float64Array(U.n).fill(NaN);
  return res.rangs[vue];
}
function couleursCumul() {
  const serie = serieCumul();
  if (vue === "compte") { const n = Math.max(1, res.dims.length); return i => Number.isNaN(serie[i]) ? MANQUE : COULEURS[Math.round(9 * serie[i] / n)]; }
  if (PALIERS[vue]) return i => couleurInd(vue, i);
  return i => couleur(serie[i]);
}
function alerteRedondance() {
  // deux indicateurs d'une même dimension ne posent pas de problème : la dimension ne pèse qu'une fois
  const p = redondances(res, U).filter(x => x.a.dimension !== x.b.dimension), n = res.dims.length;
  const ne = dimensionsEffectives(res, U);
  // nombre effectif de dimensions : combien d'informations vraiment distinctes le score réunit
  const effectif = n < 2 ? "" : `<p class="petit">${n - ne > 1
      ? `Les ${enLettres(n)} dimensions cochées se recoupent en partie, car plusieurs varient ensemble d'un territoire à l'autre. Le score repose donc sur l'équivalent de ${nb(ne, 1)} informations vraiment distinctes, et non de ${enLettres(n)}.`
      : `Les ${enLettres(n)} dimensions cochées se recoupent peu. Le score repose sur l'équivalent de ${nb(ne, 1)} informations distinctes, presque autant que de dimensions.`}</p>`;
  if (!p.length) return effectif;
  const phrase = x => `<b>${majus(le(x.a.id))}</b> et <b>${le(x.b.id)}</b> sont très corrélés (r = ${nb(x.r, 2)}).`;
  const premieres = p.slice(0, 3).map(phrase).join("<br>"), autres = p.slice(3);
  return `<div class="alerte">${premieres}
    ${autres.length ? `<details><summary>${autres.length === 1 ? "Une autre paire" : majus(enLettres(autres.length)) + " autres paires"}</summary>${autres.map(phrase).join("<br>")}</details>` : ""}
    <div style="margin-top:4px">${p.length > 1 ? "Ces indicateurs sont" : "Ces deux indicateurs sont"} dans des dimensions différentes, si bien que le score compte deux fois une information proche. ${p.length > 1 ? "Décocher l'un des indicateurs de chaque paire" : "Décocher l'un des deux"} rééquilibre le score.</div></div>${effectif}`;
}

// ---------- Fiche d'un territoire (commune ou regroupement de communes) ----------
// Petit visage de la couleur du score cumulé (même dégradé que la carte), dont la bouche passe
// du sourire, pour les territoires les plus favorisés, à la moue, pour les plus défavorisés
const visage = s => {
  if (Number.isNaN(s)) return "";
  const t = `Score cumulé : plus défavorisé que ${nb(100 * s)} % de la population`;
  const bouche = (16.5 + 7 * (0.5 - s)).toFixed(1), coin = (15.5 - 2 * (0.5 - s)).toFixed(1);
  const trait = s < 0.2 || s >= 0.8 ? "#fff" : "#222";   // yeux et bouche clairs sur les teintes foncées
  return `<svg class="visage" width="24" height="24" viewBox="0 0 24 24" role="img" aria-label="${t}"><title>${t}</title>
    <circle cx="12" cy="12" r="10.5" fill="${couleur(s)}" stroke="#333" stroke-width="1"/>
    <circle cx="8.5" cy="9.5" r="1.4" fill="${trait}"/><circle cx="15.5" cy="9.5" r="1.4" fill="${trait}"/>
    <path d="M7.5 ${coin} Q12 ${bouche} 16.5 ${coin}" fill="none" stroke="${trait}" stroke-width="1.7" stroke-linecap="round"/></svg>`;
};
// Petite jauge en dégradé (du vert au rouge) avec un repère à la position du score cumulé
const jauge = s => {
  if (Number.isNaN(s)) return "";
  const t = `Score cumulé : plus défavorisé que ${nb(100 * s)} % de la population (vert : le plus favorisé, rouge : le plus défavorisé)`;
  return `<span class="jauge" title="${t}" aria-label="${t}" style="background:linear-gradient(to right, ${COULEURS.join(", ")})"><i style="left:${(100 * s).toFixed(1)}%"></i></span>`;
};
// Décomposition d'un indicateur sous sa ligne de la fiche (types de catastrophes naturelles) : les
// types présents, du plus fréquent au plus rare. Pour un regroupement de communes, ce sont des
// moyennes pondérées par la population, comme l'indicateur lui-même.
function detailFiche(id, i) {
  const d = U.details && U.details[id];
  if (!d) return "";
  const dec = echelle === "commune" ? 0 : 1;
  const l = d.noms.map((nom, k) => [nom, d.valeurs[k][i]]).filter(([, v]) => Number.isFinite(v) && +v.toFixed(dec) > 0).sort((a, b) => b[1] - a[1]);
  return l.map(([nom, v]) => `<tr class="petit"><td style="padding-left:22px">${majus(nom)}</td><td class="n">${nb(v, dec)}</td><td></td></tr>`).join("");
}
function montrer(i, couche) {
  if (i === undefined) return;
  couche.setStyle({ weight: 2, color: "#222" });
  couche.bringToFront();
  if (mode === "liens") return montrerLiens(i);
  if (mode === "lisa") return montrerLisa(i);
  if (mode === "facteurs") return montrerFacteurs(i);
  if (mode === "double") return montrerDouble(i);
  const f = document.getElementById("fiche"), s = res.score[i];
  const ligne = ind => {
    const v = U.valeurs[ind.id][i], r = res.rangs[ind.id][i];
    const imp = U.impute[ind.id] && U.impute[ind.id].has(i) ? " *" : "";
    return `<tr><td style="padding-left:10px">${ind.nom}</td><td class="n">${valeurTexte(ind, v)}${imp}</td><td class="n" style="color:${couleurInd(ind.id, i)}">■</td></tr>` + detailFiche(ind.id, i);
  };
  let lignes = res.dims.map(d => {
    const r = res.rangDim[d.id][i], seuilAtteint = r >= 1 - res.seuil;
    return `<tr><td><b>${d.nom}</b>${seuilAtteint ? " ●" : ""}</td><td class="n">${Number.isNaN(r) ? "–" : "rang " + nb(100 * r)}</td><td class="n" style="color:${couleur(r)}">■</td></tr>` +
      res.actifs.filter(ind => ind.dimension === d.id).map(ligne).join("");
  }).join("");
  if (indic(vue) && !coches.has(vue)) lignes += ligne(indic(vue));
  f.innerHTML = `${visage(s)}${jauge(s)}<b>${U.nom[i]}</b> · ${nb(U.pop[i])} hab.<br>
    ${Number.isNaN(s) ? "Score non calculé (trop de données manquantes)" : `${res.dims.length > 1 ? `Moyenne des rangs des ${res.dims.length} dimensions : ${nb(100 * res.brut[i])} sur 100, soit p` : "P"}lus ${accorde("défavorisé", "défavorisée")} que <b>${nb(100 * s)} %</b> de la population, toutes dimensions confondues.<br>
    Parmi les ${nb(100 * res.seuil)} % les plus défavorisés dans <b>${nb(res.compte[i])} dimension${res.compte[i] > 1 ? "s" : ""}</b> sur ${res.dims.length} (●).`}
    <table>${lignes}</table>${lignes.includes(" *") ? '<div class="petit">* valeur complétée par l\'intercommunalité ou la ville (secret statistique, fusion, arrondissement)</div>' : ""}`;
  f.style.display = "block";
}

// ---------- Panneau de droite ----------
function panneau() {
  const optInd = liste => liste.map(ind => `<option value="${ind.id}" ${vue === ind.id ? "selected" : ""}>${ind.nom}</option>`).join("");
  const options = `<option value="score" ${vue === "score" ? "selected" : ""}>Cumul des désavantages (score)</option>
    <option value="compte" ${vue === "compte" ? "selected" : ""}>Nombre de dimensions défavorisées</option>
    <optgroup label="Une dimension">${DIMENSIONS.filter(d => D.indicateurs.some(ind => ind.dimension === d.id && ind.cumul)).map(d => `<option value="d:${d.id}" ${vue === "d:" + d.id ? "selected" : ""}>${d.nom}</option>`).join("")}</optgroup>
    <optgroup label="Un indicateur">${optInd(D.indicateurs.filter(ind => !ind.supplementaire))}</optgroup>
    <optgroup label="Indicateurs supplémentaires">${optInd(D.indicateurs.filter(ind => ind.supplementaire))}</optgroup>`;
  const casesDe = supp => DIMENSIONS.map(d => {
    const liste = D.indicateurs.filter(ind => ind.dimension === d.id && ind.cumul && !!ind.supplementaire === supp);
    if (!liste.length) return "";
    const active = liste.some(ind => coches.has(ind.id));
    return `<div class="dimension ${active ? "active" : ""}"><div class="titre-dim">${d.nom}</div>${liste.map(ind => `
      <label><input type="checkbox" ${coches.has(ind.id) ? "checked" : ""} onchange="cocher('${ind.id}', this.checked)">${ind.nom}<span class="i" onclick="event.preventDefault(); document.getElementById('a-${ind.id}').hidden ^= 1">ⓘ</span></label>
      <p class="aide" id="a-${ind.id}" hidden>${AIDE[ind.id] || ""} Source : ${ind.source}.</p>`).join("")}</div>`;
  }).join("");
  const cases = casesDe(false), supplementaires = casesDe(true);
  const suppCoche = D.indicateurs.some(ind => ind.supplementaire && coches.has(ind.id));
  const onglets = `<div class="onglets">
      <button class="${mode === "cumul" ? "actif" : ""}" onclick="changerMode('cumul')">Cumul</button>
      <button class="${mode === "double" ? "actif" : ""}" onclick="changerMode('double')">Double peine</button>
      ${avance ? `<button class="${mode === "lisa" ? "actif" : ""}" onclick="changerMode('lisa')">Concentrations (LISA)</button>
      <button class="${mode === "liens" ? "actif" : ""}" onclick="changerMode('liens')">Liens locaux (GWR)</button>
      <button class="${mode === "facteurs" ? "actif" : ""}" onclick="changerMode('facteurs')">Facteurs</button>` : ""}</div>
    <p class="avance"><label><input type="checkbox" ${avance ? "checked" : ""} onchange="basculerAvance(this.checked)"> Analyses avancées : concentrations, liens locaux, facteurs</label></p>`;
  const echelles = `<p class="echelle">
      ${niveauxDispo().map(n => `<label><input type="radio" name="e" ${echelle === n ? "checked" : ""} onchange="echelle = '${n}'; mettreAJour(true)"> ${NIVEAUX[n].titre}</label>`).join("")}
    </p>`;
  if (mode === "liens") { document.getElementById("panneau").innerHTML = onglets + echelles + panneauLiens(); afficherResultats(); return; }
  if (mode === "lisa") { document.getElementById("panneau").innerHTML = onglets + echelles + panneauLisa(); afficherResultatsLisa(); return; }
  if (mode === "facteurs") { document.getElementById("panneau").innerHTML = onglets + echelles + panneauFacteurs(); afficherResultatsFact(); return; }
  if (mode === "double") { document.getElementById("panneau").innerHTML = onglets + echelles + panneauDouble(); afficherResultatsDouble(); return; }
  const seuils = [0.1, 0.2, 0.25, 0.33].map(x => `<option value="${x}" ${Math.abs(x - seuilCompte) < 1e-9 ? "selected" : ""}>${nb(100 * x)} %</option>`).join("");
  document.getElementById("panneau").innerHTML = `${onglets}
    <h2>Ce que montre la carte</h2>
    <select onchange="choisirVue(this.value)">${options}</select>
    ${vue.startsWith("d:") ? (() => { const dim = vue.slice(2), l = D.indicateurs.filter(ind => ind.dimension === dim && coches.has(ind.id)).map(ind => le(ind.id));
      return `<p class="petit">${l.length ? `La dimension « ${minus(DIMENSIONS.find(d => d.id === dim).nom)} » repose ici sur ${l.length > 1 ? l.slice(0, -1).join(", ") + " et " + l.at(-1) : l[0]}. Pour la modifier, cochez ou décochez ses indicateurs plus bas.` : "Aucun indicateur de cette dimension n'est coché. Cochez-en au moins un plus bas."}</p>`; })() : ""}
    ${vue === "compte" ? `<p class="petit">Une dimension compte quand le territoire fait partie des <select style="width:auto" onchange="seuilCompte = +this.value; mettreAJour(true)">${seuils}</select> de la population la plus défavorisée pour elle.</p>` : ""}
    ${echelles}
    <h2>Ce qui entre dans le cumul</h2>
    <p class="petit">Cochez les indicateurs qui vous paraissent relever de l'injustice. Chaque indicateur est converti en rang de population, de 0 pour le plus favorisé à 100 pour le plus défavorisé. Le score d'une dimension est la moyenne des rangs de ses indicateurs cochés, et le cumul est la moyenne des dimensions. Chaque dimension pèse donc autant, quel que soit son nombre d'indicateurs. Le ⓘ explique ce que mesure un indicateur.</p>
    <div id="alerte"></div>
    <p class="petit"><span class="lien" onclick="toutCocher(true)">Tout cocher</span> · <span class="lien" onclick="toutCocher(false)">Tout décocher</span></p>
    ${cases}
    ${supplementaires ? `<details class="supp" ${suppCoche ? "open" : ""}><summary>Indicateurs supplémentaires</summary>
      <p class="petit">Plus fragiles ou en partie redondants avec les autres, ils restent disponibles pour qui veut les ajouter.</p>${supplementaires}</details>` : ""}
    <p id="revenir"><span class="lien" onclick="coches = new Set(D.indicateurs.filter(ind => ind.cumul && ind.defaut).map(ind => ind.id)); mettreAJour(true)">Revenir à la sélection proposée</span></p>
    <p class="petit">La sélection proposée retient un indicateur par dimension, et deux pour l'environnement (la pollution aux particules fines et les nuits chaudes) comme pour l'eau (les pesticides et les nitrates). La fibre couvre désormais presque tout le territoire et ne distingue plus guère les territoires. Elle est donc rangée parmi les indicateurs supplémentaires, où l'on peut toujours la cocher. Le taux de pauvreté et le niveau de vie médian ne sont pas proposés dans le cumul, car ils mesurent presque la même chose que l'indice de défavorisation. On les retrouve dans les analyses avancées.</p>
    <h2>Ce que dit la carte</h2>
    <p id="lecture" style="font-size:13.5px;line-height:1.45"></p>
    <h2 id="titre-villes"></h2>
    <div id="villes"></div>
    <h2>Qui supporte quoi ?</h2>
    <div id="qui"></div>
  `;
}

// Lecture automatique de l'onglet Cumul (panneau et export)
function partsRegions(serie, seuil) {
  const reg = regionsUnites(), tot = {}, dans = {};
  let T = 0, S = 0;
  for (let i = 0; i < U.n; i++) {
    const v = serie[i], k = reg[i], p = U.pop[i] || 0;
    if (Number.isNaN(v) || !p) continue;
    T += p; if (v >= seuil) S += p;
    if (!k) continue;
    tot[k] = (tot[k] || 0) + p; if (v >= seuil) dans[k] = (dans[k] || 0) + p;
  }
  return { ensemble: T ? S / T : NaN, regions: Object.keys(tot).map(k => [k, (dans[k] || 0) / tot[k]]).sort((a, b) => b[1] - a[1]) };
}
function interpretationCumul() {
  const n = res.dims.length;
  if (!n) return "";
  const cumul = vue === "score" || vue === "compte";
  const sujet = cumul ? "le cumul des désavantages" : vue.startsWith("d:") ? `la dimension « ${minus(DIMENSIONS.find(d => "d:" + d.id === vue).nom)} »` : le(vue);
  const serie = cumul ? res.score : serieCumul(), s = res.seuil, phrases = [];
  // où vivent les plus défavorisés ?
  // grands traits de la carte, d'après le rang moyen
  const traits = phraseTraits(serie, cumul ? "Les désavantages se concentrent surtout {ou}" : `Les situations les plus défavorables pour ${sujet} se concentrent surtout {ou}`,
    x => "rang " + nb(100 * x), " en moyenne", false);
  if (traits) phrases.push(traits);
  // part de la population dans les territoires les plus défavorisés, région par région
  const pr = partsRegions(serie, 1 - s), RC = regionsContrastees(pr.regions, pr.ensemble);
  if (Number.isFinite(pr.ensemble) && RC) {
    const pc = x => x > 0 && x < 0.005 ? "moins de 1 %" : nb(100 * x) + " %";
    const ref = Math.abs(pr.ensemble - s) > 0.02 ? ` (${pc(pr.ensemble)} en France)` : "";
    const zeros = pr.regions.filter(r => r[1] === 0).map(r => en(r[0]));
    const fin = zeros.length === 1 ? `, et nulle ${zeros[0]}` : zeros.length > 1 ? `, et nulle ${zeros.slice(0, -1).join(", ")} et ${zeros.at(-1)}`
      : `, et de ${RC.bas[1] < 0.005 ? "" : "seulement "}${pc(RC.bas[1])} ${en(RC.bas[0])}`;
    phrases.push(`La part des habitants qui vivent dans les territoires classés parmi les ${nb(100 * s)} % les plus défavorisés atteint ${pc(RC.h1[1])} ${en(RC.h1[0])} et ${pc(RC.h2[1])} ${en(RC.h2[0])}. Elle est de ${pc(RC.milieu[1])} ${en(RC.milieu[0])}, proche de la moyenne nationale${ref}${fin}.`);
  }
  // les désavantages se cumulent-ils ?
  if (cumul && n >= 2) {
    const k = n >= 5 ? 3 : 2;
    let T = 0, S = 0;
    for (let i = 0; i < U.n; i++) { const c = res.compte[i], p = U.pop[i] || 0; if (Number.isNaN(c) || !p) continue; T += p; if (c >= k) S += p; }
    if (T) phrases.push(`Les désavantages se cumulent pour ${nb(100 * S / T)} % de la population. ${majus("leur " + N().un)} fait partie des plus ${accorde("défavorisés", "défavorisées")} dans au moins ${enLettres(k)} des ${enLettres(n)} dimensions retenues.`);
  }
  // touchent-ils davantage les territoires modestes ? (au sens du niveau de vie médian)
  // (sans objet quand la carte montre le niveau de vie lui-même : la comparaison serait une tautologie)
  const surRevenu = vue === "d:niveau_vie" || (indic(vue) && indic(vue).dimension === "niveau_vie");
  if (!surRevenu) {
    const t = tranches(U, serie);
    if (t && Number.isFinite(t.modestes) && Number.isFinite(t.aises)) {
      const m = nb(100 * t.modestes), a = nb(100 * t.aises);
      phrases.push(Math.abs(t.modestes - t.aises) < 0.05
        ? `Les territoires au niveau de vie le plus bas et les plus aisés ont à peu près le même rang moyen pour ${sujet} (${m} et ${a} sur 100, 100 étant le plus défavorisé).`
        : `${cumul ? "Les" : `Pour ${sujet}, les`} territoires au niveau de vie le plus bas ont un rang moyen de ${m} sur 100 (100 étant le plus défavorisé), contre ${a} pour les plus aisés.`);
      // le score contient le niveau de vie : une partie de l'écart est mécanique
      if (cumul && res.dims.some(d => d.id === "niveau_vie") && t.modestes - t.aises >= 0.05) phrases.push("Cet écart est en partie mécanique, puisque le niveau de vie entre dans le score.");
    }
  }
  phrases.push("Les rangs comparent les territoires entre eux. Ils ne disent pas si un seuil sanitaire ou social est dépassé.");
  return phrases.join(" ");
}

// Moyenne d'une série dans dix tranches de population (déciles), du territoire le plus favorisé
// au plus défavorisé selon `ordre` (plus la valeur est haute, plus le territoire est défavorisé).
function deciles(ordre, serie) {
  const idx = [];
  for (let i = 0; i < U.n; i++) if (Number.isFinite(ordre[i]) && Number.isFinite(serie[i]) && U.pop[i] > 0) idx.push(i);
  idx.sort((a, b) => ordre[a] - ordre[b]);
  const total = idx.reduce((t, i) => t + U.pop[i], 0), s = new Array(10).fill(0), w = new Array(10).fill(0);
  let cumul = 0, S = 0;
  for (const i of idx) {
    const k = Math.min(9, Math.floor(10 * (cumul + U.pop[i] / 2) / total));
    s[k] += U.pop[i] * serie[i]; w[k] += U.pop[i]; S += U.pop[i] * serie[i]; cumul += U.pop[i];
  }
  return { m: s.map((v, k) => w[k] ? v / w[k] : NaN), moyenne: S / total };
}
// Diagramme en barres des dix déciles (SVG, sans bibliothèque)
function barresDeciles(D10, { decimales = 0, unite = "", couleur = () => "#b8ab9c", gauche = "plus favorisés", droite = "plus défavorisés", max = null }) {
  const W = 340, H = 178, g = 34, d = 8, h = 28, b = 34, l = (W - g - d) / 10;
  const vals = D10.m.filter(Number.isFinite);
  if (vals.length < 10) return "";
  const haut = max ?? Math.max(...vals, D10.moyenne) * 1.12, bas = Math.min(0, ...vals);
  const y = v => h + (H - h - b) * (1 - (v - bas) / (haut - bas));
  const barres = D10.m.map((v, k) => {
    const x = g + k * l + 2, yv = y(v);
    return `<rect x="${x}" y="${Math.min(yv, y(0))}" width="${l - 4}" height="${Math.abs(y(0) - yv)}" fill="${couleur(k)}"/>
      <text x="${x + (l - 4) / 2}" y="${yv - 3}" text-anchor="middle" font-size="9" fill="#444">${nb(v, decimales)}</text>
      <text x="${x + (l - 4) / 2}" y="${H - b + 12}" text-anchor="middle" font-size="9" fill="#777">${k + 1}</text>`;
  }).join("");
  const ym = y(D10.moyenne);
  return `<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ${W} ${H}" width="100%" font-family="system-ui, -apple-system, 'Segoe UI', Roboto, sans-serif" style="max-width:${W}px;display:block;margin:6px 0">
    <line x1="${g}" x2="${W - d}" y1="${y(0)}" y2="${y(0)}" stroke="#999"/>
    ${barres}
    <line x1="${g}" x2="${W - d}" y1="${ym}" y2="${ym}" stroke="#333" stroke-dasharray="4 3"/>
    <text x="${g - 3}" y="${ym + 3}" text-anchor="end" font-size="9" fill="#333">moy.</text>
    <text x="${g}" y="${H - 6}" font-size="10" fill="#555">← ${gauche}</text>
    <text x="${W - d}" y="${H - 6}" text-anchor="end" font-size="10" fill="#555">${droite} →</text>
    ${unite ? `<text x="${g}" y="12" font-size="10" fill="#555">${unite}</text>` : ""}
  </svg>`;
}
// Valeurs d'origine d'un indicateur (ou rangs sur 100 pour le score et les dimensions)
function valeursGraphique(id) {
  const ind = indic(id);
  if (ind && U.valeurs[id]) return { serie: U.valeurs[id], decimales: ind.decimales ?? 1, unite: `${ind.unite}${ind.sens < 0 ? " (une valeur basse est défavorable)" : ""}` };
  const r = id === "score" ? res.score : serieCumul();
  return { serie: Array.from(r, v => 100 * v), decimales: 0, unite: "rang moyen sur 100 (100 = le plus défavorisé)" };
}

// Onglet Cumul : la carte affichée, selon le niveau de vie médian des territoires
// Graphique en déciles de l'onglet affiché (Cumul ou Double peine) : titre, dessin SVG et note.
// Il sert dans le panneau et dans l'export.
function grapheActuel() {
  if (mode === "double") {
    initDouble();
    const G = valeursGraphique(dp.e), b = Math.round(10 * (1 - dp.seuil));
    const svg = barresDeciles(deciles(rangVar(dp.s), G.serie), { decimales: G.decimales, unite: G.unite, couleur: k => k >= b ? "#f1a340" : "#c9bfb2" });
    return svg ? { titre: `${majus(le(dp.e))} selon ${le(dp.s)}`, svg,
      note: `La population est répartie en dix parts égales selon ${le(dp.s)}, de la plus favorisée (1) à la plus défavorisée (10). Chaque barre donne la moyenne ${de(dp.e)} dans ces territoires. Les barres orange correspondent aux territoires défavorisés de la carte. Le trait pointillé indique la moyenne nationale.` } : null;
  }
  if (mode !== "cumul") return null;
  const revenu = U.valeurs.revenu;
  if (!revenu || !res.dims.length) return null;
  // sans objet quand la carte montre le niveau de vie lui-même
  if (vue === "d:niveau_vie" || (indic(vue) && indic(vue).dimension === "niveau_vie")) return null;
  const G = valeursGraphique(vue === "compte" ? "score" : vue);
  const svg = barresDeciles(deciles(Array.from(revenu, v => -v), G.serie), { decimales: G.decimales, unite: G.unite, gauche: "plus aisés", droite: "plus modestes", max: G.unite.startsWith("rang") ? 100 : null });
  if (!svg) return null;
  const sujet = vue === "score" || vue === "compte" ? "le cumul des désavantages" : vue.startsWith("d:") ? `la dimension « ${minus(DIMENSIONS.find(d => "d:" + d.id === vue).nom)} »` : le(vue);
  return { titre: `${majus(sujet)} selon le niveau de vie`, svg,
    note: `La population est répartie en dix parts égales selon le niveau de vie médian de ${sonUnite()} (Insee, Filosofi), des territoires les plus aisés (1) aux plus modestes (10). Chaque barre donne la moyenne pour ${sujet}. Le trait pointillé indique la moyenne nationale.` };
}
function grapheCumul() {
  const g = grapheActuel();
  return g ? `${g.svg}<p class="petit">${g.note}</p>` : "";
}

// ---------- Classement des grandes villes (ou des territoires les plus peuplés) ----------
// Pour la carte affichée. À l'échelle des communes, Paris, Lyon et Marseille regroupent leurs
// arrondissements (moyenne de leurs rangs, pondérée par la population).
let nombreVilles = 30;
function grandesVilles(nombre = nombreVilles) {
  const serie = serieCumul(), groupes = new Map();
  for (let i = 0; i < U.n; i++) {
    let cle = U.code[i], nom = U.nom[i];
    if (echelle === "commune") {
      if (/^751(0[1-9]|1[0-9]|20)$/.test(cle)) { cle = "75056"; nom = "Paris"; }
      else if (/^6938[1-9]$/.test(cle)) { cle = "69123"; nom = "Lyon"; }
      else if (/^132(0[1-9]|1[0-6])$/.test(cle)) { cle = "13055"; nom = "Marseille"; }
    }
    const g = groupes.get(cle) || { nom, pop: 0, s: 0, w: 0, i: [] };
    g.pop += U.pop[i] || 0; g.i.push(i);
    if (Number.isFinite(serie[i])) { g.s += (U.pop[i] || 0) * serie[i]; g.w += U.pop[i] || 0; }
    groupes.set(cle, g);
  }
  return [...groupes.values()].sort((a, b) => b.pop - a.pop).slice(0, nombre)
    .map(g => ({ ...g, v: g.w > 0 ? g.s / g.w : NaN })).sort((a, b) => (Number.isNaN(a.v) ? 2 : a.v) - (Number.isNaN(b.v) ? 2 : b.v));
}
const titreVilles = k => echelle === "commune" ? `Les ${k} plus grandes villes` : `Les ${k} ${N().des} les plus ${accorde("peuplés", "peuplées")}`;
function formatVilles() {
  const compte = vue === "compte", n = res.dims.length;
  return { valeur: v => Number.isNaN(v) ? "–" : compte ? `${nb(v, 1)} sur ${n}` : nb(100 * v),
           teinte: v => compte ? (Number.isNaN(v) ? MANQUE : COULEURS[Math.round(9 * v / Math.max(1, n))]) : couleur(v) };
}
// Pour l'export : les dix plus grandes villes, classées (onglet Cumul seulement)
function villesExport() {
  if (mode !== "cumul" || !U) return null;

const STATS = {

// Un territoire où la pente n'est pas significative garde la couleur de sa classe, très éclaircie :
// on voit qu'il a été calculé, et le sens de la relation, sans qu'il attire l'œil.
const palir = c => "#" + [1, 3, 5].map(k => Math.round(255 - 0.25 * (255 - parseInt(c.slice(k, k + 2), 16))).toString(16).padStart(2, "0")).join("");

const majus = t => t.charAt(0).toUpperCase() + t.slice(1);

const enLettres = n => ["zéro", "un", "deux", "trois", "quatre", "cinq", "six", "sept", "huit", "neuf", "dix", "onze", "douze", "treize", "quatorze", "quinze", "seize"][n] || nb(n);
// Nom d'un indicateur avec son article : le(id) « la surmortalité », de(id) « de la surmortalité »,

const le = id => id === "score" ? "le cumul des désavantages" : ARTICLES[id] || `l'indicateur « ${nomVar(id)} »`;
const de = id => le(id).replace(/^(le |les |la |l')/, m => ({ "le ": "du ", "les ": "des ", "la ": "de la ", "l'": "de l'" })[m]);
const a_ = id => le(id).replace(/^(le |les |la |l')/, m => ({ "le ": "au ", "les ": "aux ", "la ": "à la ", "l'": "à l'" })[m]);

// Valeurs d'une variable pour le calcul : rangs de population (orientés, 1 = le plus défavorisé) ou valeurs brutes
function serieVar(id) {
  if (id === "score") return res.score;

// Ce qui détermine le résultat : s'il ne change pas, inutile de recalculer
function cleBaseLiens() {
  const l = liens, score = [l.x, l.y].includes("score") ? [...coches].sort().join() : "";

  else if (!GW || GW.cle !== cleLiens()) planifierGWR();

let travailleur = null, demande = 0, minuterie = null, enCours = false;
function planifierGWR() { clearTimeout(minuterie); minuterie = setTimeout(() => lancerGWR("calculer"), 250); }
function lancerGWR(quoi) {
  const l = liens, id = ++demande;
  const o = { cx: U.cx, cy: U.cy, x: Array.from(serieVar(l.x)), y: Array.from(serieVar(l.y)), p: l.pop ? U.pop : null,

// Autocorrélation spatiale. Si les écarts au modèle se ressemblent entre voisins, ils n'apportent pas
// des informations indépendantes et les t locaux sont trop optimistes. La variance de la pente dépend
// de l'autocorrélation de l'indicateur explicatif et de celle des résidus, pas de celle de l'indicateur
// étudié lui-même : la part de sa structure spatiale que la GWR explique ne gonfle pas les t. On réduit
// donc le nombre effectif d'observations selon l'approximation de Bartlett, n' = n (1 − Ix Ie) / (1 + Ix Ie),
// où Ix et Ie sont les I de Moran de l'indicateur explicatif et des résidus de la GWR sur les 8 plus
// proches voisins (Clifford, Richardson et Hémon, 1989 ; Dutilleul, 1993). Les t sont multipliés par √(n'/n).
function moranVoisins(v) {
  const V = moranVoisins[echelle] || (moranVoisins[echelle] = LISA.plusProches(Array.from(U.cx), Array.from(U.cy), 8));
  let m = 0, n = 0;
  for (let i = 0; i < v.length; i++) if (Number.isFinite(v[i])) { m += v[i]; n++; }
  m /= n;
  let num = 0, den = 0, nb_ = 0;

    let s = 0, k = 0;
    for (const j of V[i]) if (Number.isFinite(v[j])) { s += v[j] - m; k++; }
    den += (v[i] - m) ** 2;
    if (k) { num += (v[i] - m) * s / k; nb_++; }
  }
  return nb_ && den > 0 ? (n / nb_) * num / den : 0;
}
function corrigerAutocorr() {
  const Ix = moranVoisins(serieVar(liens.x)), Iy = moranVoisins(serieVar(liens.y));
  const Ie = GW.e ? moranVoisins(Array.from(GW.e)) : Iy, p = Math.max(0, Ix * Ie);
  GW.autocorr = { Ix, Iy, Ie, f: Math.max(0.02, (1 - p) / (1 + p)) };

function recevoir(m, cle, quoi) {

}

// Curseur logarithmique pour la largeur de bande
function bornesBande() {
  return liens.adaptatif ? [5, Math.max(10, Math.min(U.n - 1, echelle === "commune" ? 5000 : 600))] : [2, 400];

// Couleur de chaque territoire selon la statistique locale choisie
function couleursLiens() {
  palette = null;
  if (!GW || GW.echelle !== echelle) return () => MANQUE;
  const l = liens, T = tLu(), serie = l.stat === "t" ? T : GW[l.stat], seuil = GW.tCritique;
  const nonSignif = i => l.signif && !(Math.abs(T[i]) >= seuil);
  const val = [];
  for (let i = 0; i < serie.length; i++) if (Number.isFinite(serie[i])) val.push(serie[i]);
  if (!val.length) return () => MANQUE;
  if (l.stat === "r2") {
    val.sort((a, b) => a - b);
    const haut = Math.max(1e-9, val[Math.floor(0.98 * (val.length - 1))]);
    palette = { type: "seq", bas: 0, haut };
    return i => { if (!Number.isFinite(serie[i])) return MANQUE; const c = SEQUENTIELLE[Math.min(9, Math.floor(10 * serie[i] / haut))]; return nonSignif(i) ? palir(c) : c; };
  }
  const globale = { r: GW.global.r, b: GW.global.b, t: 0 }[l.stat];
  const c = l.centre === "global" ? globale : 0;
  const ecarts = val.map(v => Math.abs(v - c)).sort((a, b) => a - b);
  let M = Math.max(1e-9, ecarts[Math.floor(0.98 * (ecarts.length - 1))]);
  if (l.stat === "r") M = Math.min(M, Math.max(1 - c, 1 + c));
  palette = { type: "div", c, M };
  return i => {
    const v = serie[i];
    if (!Number.isFinite(v)) return MANQUE;
    const couleur_ = DIVERGENTE[Math.max(0, Math.min(9, Math.floor(5 + 5 * (v - c) / M)))];
    return nonSignif(i) ? palir(couleur_) : couleur_;
  };
}

// Nuage de points des deux indicateurs, avec la droite d'ensemble

  if (!cv) return;
  const X = serieVar(liens.x), Y = serieVar(liens.y), dpr = window.devicePixelRatio || 1;
  const L_ = cv.clientWidth, H = cv.clientHeight;
  if (cv.width !== L_ * dpr) { cv.width = L_ * dpr; cv.height = H * dpr; }
  const ctx = cv.getContext("2d");

    for (let i = 0; i < X.length; i++) if (Number.isFinite(X[i]) && Number.isFinite(Y[i])) { x0 = Math.min(x0, X[i]); x1 = Math.max(x1, X[i]); y0 = Math.min(y0, Y[i]); y1 = Math.max(y1, Y[i]); }

      ctx.moveTo(px(x0), py(GW.global.a + GW.global.b * x0)); ctx.lineTo(px(x1), py(GW.global.a + GW.global.b * x1)); ctx.stroke();
    }

  } else if (l.schema === "distance") V = LISA.distance(U.cx, U.cy, l.distance);

    if (id !== demandeLisa) return;
    const W = voisinage();
    const o = { x: Array.from(serieLisa(l.x)), y: l.y ? Array.from(serieLisa(l.y)) : null, debut: W.debut, liste: W.liste, permutations: l.permutations };
    const fin = r => { if (id !== demandeLisa) return; recevoirLisa(r, cle, W); };

    if (!travailleurLisa) try { travailleurLisa = new Worker("lisa.js"); } catch (e) { travailleurLisa = null; }

function interpretationLisa() {

// Diagramme de Moran : la valeur centrée-réduite de chaque territoire, et la moyenne de ses voisins

// ---------- Onglet « Double peine » : défavorisé ET exposé ----------
// Pour chaque indicateur, un territoire est « défavorable » s'il fait partie de la part de la
// population la plus défavorisée (un tiers par défaut, d'après les rangs de population). On en tire
// quatre classes. La carte met en avant la seule qui compte pour le propos, la double peine, par la
// couleur la plus foncée ; les deux désavantages isolés ont une valeur moyenne et deux teintes
// distinctes ; le reste est presque effacé (Bertin : la valeur ordonne, la teinte distingue).

function interpretationFL() {
  const reg = regionsUnites(), Y = le(fact.y);
  const pop = new Array(FL.ids.length).fill(0), popReg = {}, dom = {};
  let total = 0, faibles = 0; const r2s = [];
  for (let i = 0; i < U.n; i++) {
    const d = FL.dominant[i], p = U.pop[i] || 0;
    if (d < 0) continue;
    total += p; pop[d] += p; r2s.push(FL.r2[i]);
    if (FL.r2[i] < SEUIL_R2_FACT) faibles += p;
    const r = reg[i]; if (r) { popReg[r] = (popReg[r] || 0) + p; dom[r + "|" + d] = (dom[r + "|" + d] || 0) + p; }
  }
  if (!total) return "";
  r2s.sort((a, b) => a - b);
  const ordre = pop.map((p, j) => j).filter(j => pop[j] > 0).sort((a, b) => pop[b] - pop[a]);
  const lieux = j => Object.keys(popReg).map(r => [r, (dom[r + "|" + j] || 0) / popReg[r]]).filter(x => x[1] >= 0.5).sort((u, v) => v[1] - u[1]).slice(0, 2).map(x => en(x[0]));
  const phrases = [];
  const a = ordre[0], la = lieux(a);
  phrases.push(`Localement, le facteur qui compte le plus est celui ${de(FL.ids[a])}, pour ${nb(100 * pop[a] / total)} % de la population${la.length ? ", notamment " + la.join(" et ") : ""}.`);
  const traits = phraseTraits(Array.from(FL.dominant, d => d < 0 ? NaN : d === a ? 1 : 0), "Il domine surtout {ou}", x => nb(100 * x) + " %", " des habitants");
  if (traits) phrases.push(traits);
  if (ordre.length > 1) { const b = ordre[1], lb = lieux(b); phrases.push(`Vient ensuite ${le(FL.ids[b])}, qui domine pour ${nb(100 * pop[b] / total)} %${lb.length ? ", surtout " + lb.join(" et ") : ""}.`); }
  phrases.push(`Le R² local médian est de ${fmt(r2s[Math.floor(r2s.length / 2)])}.` + (faibles / total > 0.05 ? ` Pour ${nb(100 * faibles / total)} % des habitants, il reste sous ${fmt(SEUIL_R2_FACT, 1)} : là, aucun facteur n'explique grand-chose ${de(fact.y)}, et la couleur est pâle.` : ""));
  phrases.push(`Pour chaque territoire, le calcul porte sur ses ${nb(FL.k)} plus proches voisins. Un voisinage plus étroit fait ressortir des différences plus locales, mais plus fragiles.`);
  return phrases.join(" ");
}
