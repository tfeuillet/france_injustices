function expliquer() {
  const C = cache.commune || unites(D, "commune");
  const lignesInd = D.indicateurs.map(ind => {
    const n = C.valeurs[ind.id].filter(v => !Number.isNaN(v)).length;
    return `<tr><td><b>${ind.nom}</b></td><td>${(DIMENSIONS.find(d => d.id === ind.dimension) || {}).nom || ""}${ind.cumul ? "" : " (hors cumul)"}</td><td>${AIDE[ind.id] || ""}</td><td>${ind.source}</td><td>${nb(n)} communes</td></tr>`;
  }).join("");
  const rapport = Object.entries(D.rapport || {}).map(([k, v]) => `<tr><td>${k}</td><td>${v}</td></tr>`).join("");
  document.getElementById("texte").innerHTML = `
    <h2>Le principe</h2>
    <p>Les habitants des territoires les plus défavorisés sont-ils aussi ceux qui subissent le plus de nuisances environnementales (pollution de l'air, de l'eau, etc.) ou qui rencontrent le plus de difficultés pour accéder aux services (santé, numérique, éducation, etc.) ? Cette question s'inscrit dans le champ de la justice distributive, qui s'intéresse à la manière dont les ressources et les contraintes se répartissent entre les groupes sociaux et dans l'espace (Walker, 2009). Certaines populations peuvent ainsi être davantage exposées aux nuisances tout en disposant de moins de ressources pour s'en protéger (Huang et London, 2012).</p>
    <p>Pour appréhender ces situations, l'outil distingue trois notions complémentaires : l'<b>inégalité territoriale</b>, le <b>cumul de désavantages</b> et l'<b>injustice distributive</b>. Chaque indicateur rend compte d'une inégalité territoriale, en décrivant la répartition inégale d'une ressource, d'une nuisance ou d'un état de santé dans l'espace. Le score cumulé et le nombre de dimensions défavorisées permettent, quant à eux, de mesurer le cumul de désavantages, lorsque plusieurs conditions défavorables se concentrent sur un même territoire. Ces inégalités et leur cumul ne relèvent pas nécessairement d'une injustice. La notion d'injustice distributive renvoie plus spécifiquement aux situations dans lesquelles les ressources et les nuisances se répartissent au détriment des populations déjà défavorisées sur le plan social et économique.</p>
    <p>Le tableau « Qui supporte quoi ? » permet d'examiner ces situations en comparant les territoires les plus modestes aux plus aisés, tandis que l'onglet « Double peine » localise les territoires où désavantage social et exposition aux nuisances se cumulent.</p>
    <p>Cet outil interactif examine cette question à travers plusieurs dimensions thématiques. Le <b>niveau de vie</b> décrit les conditions matérielles des habitants et leur situation face à l'emploi. L'<b>accès aux services</b> renseigne sur l'éloignement des professionnels de santé, des lycées et des formations post-bac, et l'<b>accès au numérique</b> sur la possibilité de disposer d'une connexion à la fibre. L'<b>éducation</b> porte sur la ségrégation sociale entre collèges. L'<b>environnement</b> décrit l'exposition aux pollutions, aux nuits chaudes, aux inondations, aux risques industriels et aux catastrophes naturelles. La dimension <b>pesticides et eau</b> porte sur les pesticides et les nitrates présents dans l'eau du robinet. La <b>participation politique</b> est ici mesurée par l'abstention, et la <b>santé</b> par les écarts de mortalité, une fois prises en compte les différences d'âge et de sexe. Enfin, les <b>trajectoires</b> retracent l'évolution de l'emploi et de la population sur dix ans, ainsi que celle de la position économique des territoires sur plusieurs décennies.</p>
    <p>Il s'agit d'un outil exploratoire. Chacun peut modifier la sélection des indicateurs pour voir quels constats se maintiennent et lesquels dépendent des dimensions choisies.</p>

    <h2>Les indicateurs</h2>
    <table><tr><th>Indicateur</th><th>Dimension</th><th>Ce qu'il mesure</th><th>Source</th><th>Couverture</th></tr>${lignesInd}</table>

    <h2>Démarche méthodologique détaillée</h2>
    <h3>1. Rendre les indicateurs comparables</h3>
    <p>Un des principaux enjeux consiste à pouvoir comparer des indicateurs qui ne sont pas mesurés dans les mêmes unités ni toujours aux mêmes échelles. Pour cela, chaque indicateur est d'abord converti en rang de population, entre 0 et 100. Si une commune est classée au rang 80 pour l'indicateur « Pollution aux particules fines », cela signifie qu'elle est plus exposée que des communes où vivent 80 % des habitants de France métropolitaine. Ce rang tient donc compte de la population, si bien qu'un village et une grande ville ne pèsent pas autant. Pour les indicateurs où une valeur élevée est favorable, comme l'accès aux médecins, le classement est inversé. Le passage par les rangs est l'une des normalisations classiques des indicateurs composites (OCDE et JRC, 2008). Il ne garde que l'ordre des communes et perd l'ampleur des écarts, mais il évite que quelques valeurs extrêmes écrasent tout.</p>
    <p>Les pesticides et les nitrates dans l'eau font exception, dans la mesure où la distribution de leurs valeurs est fortement dissymétrique (typiquement beaucoup de valeurs faibles et peu de valeurs élevées). Une grande partie de la population boit une eau où l'on ne quantifie presque rien, et quelques réseaux concentrent les valeurs fortes. Les rangs étireraient alors des écarts sans signification en bas de l'échelle, comme 0,03 et 0,06 µg/L de pesticides, qui tiennent aux seuils de quantification des laboratoires, et tasseraient les écarts importants en haut. Pour ces deux indicateurs, la valeur est donc d'abord ramenée à un palier, puis le palier est converti en rang de population. Tous les territoires d'un même palier reçoivent le même rang. Le premier palier, où l'on ne mesure presque rien, est au rang 0, équivalant à une absence d'exposition. Les paliers suivent les limites de qualité de l'eau. Pour les pesticides, ce sont 0,1 µg/L, limite par substance, et 0,5 µg/L, limite pour le total. Pour les nitrates, ce sont 25 mg/L, ancienne valeur guide de la réglementation européenne, 40 mg/L, seuil de vigilance, et 50 mg/L, limite de qualité. Sous 25 mg/L, l'eau est jugée de bonne qualité et les écarts ne départagent pas les territoires. Ces limites ne sont pas des seuils sanitaires, et les paliers restent une convention. Les fiches affichent toujours les valeurs mesurées.</p>
    <p>La même règle s'applique aux indicateurs où beaucoup de territoires sont à égalité, souvent parce qu'ils ne sont pas exposés : les nuits chaudes, les sites Seveso, les arrêtés de catastrophe naturelle, la population en zone inondable, les dépassements des limites de pesticides et la fibre, quand tous les locaux sont raccordables. Les territoires les mieux lotis, à égalité entre eux, sont au rang 0, comme ceux qui n'ont aucune nuit chaude ou aucun site Seveso. Avec la règle habituelle, ils auraient reçu le rang du milieu de leur groupe, ce qui aurait réduit l'écart entre les territoires exposés et ceux qui ne le sont pas, et donc biaisé le score cumulé.</p>
    <h3>2. Regrouper par dimension, puis cumuler</h3>
    <p>Beaucoup d'indicateurs sont partiellement redondants, et parfois très fortement. Le taux de pauvreté, le niveau de vie et l'indice de défavorisation sont par exemple corrélés à plus de 0,8. Si l'on additionnait tous les indicateurs cochés, le niveau de vie compterait trois fois quand la fibre compterait une fois, et le score dépendrait finalement surtout de la manière dont on a dressé la liste. C'est pourquoi le cumul se fait en deux temps. On calcule d'abord le score de chaque dimension, qui correspond à la moyenne des rangs de ses indicateurs cochés. Le score cumulé est ensuite la moyenne des dimensions, qui pèsent donc toutes autant. Prenons une commune classée au rang 88 pour l'accès aux services et au rang 44 pour l'environnement, ces deux dimensions étant les seules cochées. La moyenne de ses deux rangs vaut 66. Ce score est ensuite lui-même converti en rang de population (point 4). Or les moyennes se resserrent autour de 50, car il est rare d'être très mal placé dans toutes les dimensions à la fois. Une moyenne de 66 place donc déjà la commune au-dessus de 81 % de la population. La fiche de chaque territoire donne les deux chiffres, la moyenne des rangs et le rang final. Ajouter une deuxième mesure de la pollution précise la dimension « environnement » sans augmenter son poids. Pour la même raison, les distances aux soins, au lycée et aux formations post-bac sont réunies dans une seule dimension, « accès aux services ». Elles suivent toutes l'opposition entre villes et campagnes, et l'éloignement compterait sinon plusieurs fois. C'est la logique de l'indice de défavorisation anglais (Noble et al., 2006) et de l'indice de développement humain.</p>
    <p>Pour la même raison, le taux de pauvreté et le niveau de vie médian ne sont pas proposés dans le cumul, où l'indice européen de défavorisation les représente. Quand deux indicateurs cochés dans des dimensions différentes restent très corrélés (au-delà de 0,7), le panneau le signale. Seules les corrélations positives comptent ici. Une corrélation négative, comme celle entre la pollution au dioxyde d'azote et l'éloignement des services, oppose deux désavantages qui se compensent dans le score au lieu de s'additionner. Le panneau indique enfin le nombre effectif de dimensions, p² / Σ r², calculé sur la matrice de corrélation des p dimensions cochées. Il vaut p quand les dimensions sont indépendantes et 1 quand elles disent toutes la même chose. Il dit combien d'informations vraiment distinctes le score réunit. Si plus de la moitié des dimensions cochées manquent pour une commune, son score n'est pas calculé et elle apparaît en gris.</p>
    <h3>3. Compter les dimensions défavorisées</h3>
    <p>Une moyenne peut masquer un cumul. Une commune moyenne partout et une commune très défavorisée dans une dimension, très favorisée dans une autre, ont le même score. La carte propose donc un second mode de lecture, inspiré de l'indice de pauvreté multidimensionnelle des Nations unies (Alkire et Foster, 2011). Pour chaque dimension, une commune est dite défavorisée si elle fait partie des 20 % de la population la plus défavorisée. La carte compte alors ces dimensions. Le seuil peut être changé.</p>
    <h3>4. Lire la carte</h3>
    <p>Chaque couleur réunit 10 % de la population, du vert (les territoires les moins défavorisés) au rouge (les plus défavorisés). Le score cumulé est lui-même converti en rang de population, pour que ce découpage reste vrai. Avec ce découpage, la carte d'un indicateur et celle du score se lisent de la même façon.</p>
    <h3>5. Quatre niveaux géographiques</h3>
    <p>La carte propose quatre niveaux géographiques, la commune, l'intercommunalité, le bassin de vie et la zone d'emploi. Les données sont d'abord établies par commune, Paris, Lyon et Marseille étant découpées en arrondissements. Quand une source ne donne que la ville entière, ses arrondissements en reçoivent la valeur, signalée par un astérisque. Pour les trois autres niveaux, la valeur d'un territoire est la moyenne de ses communes, pondérée par leur population, puis les rangs sont refaits. La ségrégation entre collèges et la surmortalité font exception, car elles sont recalculées directement à partir des collèges et des décès de chaque territoire.</p>
    <p>Le passage d'une échelle à l'autre change parfois beaucoup le résultat. C'est un effet bien connu des géographes, désigné sous le nom de MAUP (<em>modifiable areal unit problem</em>, ou problème des unités spatiales modifiables, Openshaw, 1984). La moyenne d'une intercommunalité peut cacher une commune très défavorisée au milieu de voisines aisées.</p>
    <h3>6. Qui supporte quoi ?</h3>
    <p>Le tableau du panneau compare deux groupes de même taille. Le premier réunit les 20 % de la population qui vivent dans les communes au niveau de vie médian le plus bas, le second les 20 % qui vivent dans les communes au niveau de vie le plus élevé. Si les premiers sont plus exposés à un désavantage que les seconds, ce désavantage s'ajoute à la pauvreté au lieu de la compenser. C'est la forme la plus claire d'injustice territoriale.</p>

    <h3>7. Les concentrations (LISA)</h3>
    <p>Trois onglets d'analyse n'apparaissent que si l'on coche « Analyses avancées », pour garder la carte simple à la première lecture. Le premier, « Concentrations », cherche où les désavantages se concentrent. Pour chaque territoire, l'indice local de Moran (Anselin, 1995) compare sa valeur à la moyenne de ses voisins. Un territoire défavorisé entouré de territoires défavorisés forme une concentration (haut-haut). Un territoire favorisé entouré de favorisés forme une concentration d'avantages (bas-bas). Les cas contraires sont des îlots, défavorisés au milieu de voisins favorisés ou l'inverse. En version bivariée (Anselin, Syabri et Smirnov, 2002), on compare un indicateur ici à un autre chez les voisins, par exemple la pauvreté d'une commune et la surmortalité autour d'elle.</p>
    <p>Les voisins sont par défaut les territoires qui touchent le territoire, même par un seul point (contiguïté dite reine). On peut élargir aux voisins des voisins, ou définir le voisinage par une distance ou par un nombre de plus proches voisins. Les quelques îles sans voisin reçoivent leur plus proche voisin. La significativité est estimée par permutations conditionnelles. Pour chaque territoire, on tire au hasard des voisins fictifs des centaines de fois et on regarde si la ressemblance observée dépasse celle du hasard. Comme on fait un test par territoire, on peut aussi appliquer la correction de Benjamini et Hochberg (1995), qui contrôle le taux de fausses découvertes. Le calcul suit celui du module esda de PySAL, avec lequel il a été vérifié.</p>
    <h3>8. Les liens locaux (GWR)</h3>
    <p>L'onglet « Liens locaux » s'intéresse aux corrélations spatiales entre deux indicateurs. On peut se demander si l'abstention suit la pauvreté, ou si les territoires qui perdent des emplois sont ceux qui étaient déjà les plus défavorisés. Une corrélation calculée sur toute la France donne un seul chiffre, qui peut masquer des situations très différentes d'une région à l'autre. La carte calcule donc la relation autour de chaque territoire, sur la base de ses voisins uniquement.</p>
    <p>C'est une régression géographiquement pondérée (GWR) bivariée, avec un seul indicateur explicatif (Fotheringham, Brunsdon et Charlton, 2002). La corrélation locale est celle des statistiques géographiquement pondérées (Brunsdon, Fotheringham et Charlton, 2002). Autour de chaque commune, les voisins comptent d'autant plus qu'ils sont proches. La forme de cette décroissance est donnée par le noyau. Avec le noyau bicarré, le tricube ou le noyau uniforme, les voisins au-delà d'une certaine distance ne comptent plus du tout. Avec le noyau gaussien, le poids diminue sans jamais s'annuler (tous les voisins comptent, mais d'autant moins qu'ils sont loin), et le calcul est plus lent.</p>
    <p>La largeur de bande fixe la taille du voisinage. Elle peut être fixe, en kilomètres, ou adaptative, en nombre de voisins. La largeur adaptative convient mieux aux communes, très petites et serrées dans les villes, très grandes dans les montagnes. Une largeur étroite donne une carte très contrastée mais fragile, une largeur large se rapproche de la relation nationale. Par défaut, la carte retient la largeur qui minimise le critère d'information d'Akaike corrigé (AICc), qui met en balance la qualité de l'ajustement et le nombre de paramètres. Le curseur permet ensuite de l'élargir ou de la resserrer. Quand on pondère par la population, une grande ville pèse plus qu'un village dans le calcul de ses voisins.</p>
    <p>La carte peut montrer quatre résultats. La corrélation locale va de -1 à 1. La pente dit de combien l'indicateur étudié augmente quand l'autre augmente d'une unité. Le t de Student dit si cette pente se distingue nettement de zéro. Le R² local donne la part des écarts expliquée par la relation. Comme on fait un test par commune, des milliers de tests au total, certains seraient significatifs par hasard. Le seuil est donc relevé selon la méthode de da Silva et Fotheringham (2016). Les t sont aussi corrigés de l'autocorrélation spatiale. Quand les écarts au modèle se ressemblent d'une commune à sa voisine, elles n'apportent pas deux informations indépendantes. Ce qui compte pour la précision de la pente est l'autocorrélation de l'indicateur explicatif et celle des résidus de la GWR. Celle de l'indicateur étudié ne compte pas en elle-même, puisque la part de sa structure spatiale que le modèle local explique ne fausse pas le test (Dutilleul, 1993). Le nombre effectif d'observations est réduit selon l'approximation de Bartlett, n' = n (1 − I<sub>x</sub> I<sub>e</sub>) / (1 + I<sub>x</sub> I<sub>e</sub>), où I<sub>x</sub> et I<sub>e</sub> sont les I de Moran de l'indicateur explicatif et des résidus sur les huit plus proches voisins (Clifford, Richardson et Hémon, 1989), et les t sont multipliés par √(n'/n). C'est une correction d'ensemble, la même pour tous les territoires. Elle est faible avec un voisinage étroit, qui absorbe l'essentiel de la structure spatiale, et devient forte quand on élargit le voisinage. Enfin, la largeur de bande optimale selon l'AICc peut être très étroite quand un indicateur varie doucement dans l'espace. La carte suit alors des gradients locaux plus qu'une relation, et un avertissement s'affiche sous trente voisins. Le calcul a été vérifié avec le module mgwr de PySAL.</p>
    <p>Avec les rangs, chaque indicateur est orienté comme dans le score, de 0 pour le plus favorable à 1 pour le plus défavorable. Une corrélation positive veut alors toujours dire que les deux désavantages vont ensemble. Les valeurs brutes gardent les unités de chaque indicateur, mais sont plus sensibles aux valeurs extrêmes.</p>
    <p>Cet onglet sert en particulier à rapprocher des structures et des processus, par exemple la surmortalité et la défavorisation sociale. C'est l'un des objectifs centraux de l'analyse spatiale, en espérant que mes étudiants de L3 lisent cela car c'est le prochain sujet de partiel. L'incidence des cancers n'est publiée que par département, car les registres ne couvrent qu'une partie du territoire. La santé est donc approchée ici par la mortalité générale, à âge et sexe égaux.</p>
    <p>Corrélation n'est pas causalité, ce qu'on peut également dire en latin pour épater son prochain : <em>cum hoc ergo propter hoc</em>. Une corrélation reflète souvent un troisième facteur (qu'on appelle facteur de confusion), comme l'âge de la population ou l'éloignement des villes. Les communes au bord de la mer ou des frontières ont aussi moins de voisins, ce qui rend leur estimation moins sûre.</p>

    <h3>9. Hiérarchiser les facteurs</h3>
    <p>L'onglet « Facteurs » part d'un indicateur (par exemple la surmortalité) et cherche ceux qui lui sont le plus associés. L'analyse estime une régression multiple des rangs de la cible sur ceux des facteurs cochés, puis répartit son R² entre eux. La part d'un facteur est le gain moyen de R² qu'il apporte quand on l'ajoute au modèle, sur tous les ordres d'entrée possibles (Lindeman, Merenda et Gold, 1980 ; Grömping, 2006). C'est la valeur de Shapley de la théorie des jeux. Les parts s'additionnent exactement au R², et ce que deux facteurs corrélés expliquent ensemble est partagé entre eux au lieu d'être compté deux fois.</p>
    <p>La même décomposition est refaite autour de chaque territoire, sur la base de ses voisins pondérés par un noyau paramétrable, comme dans l'onglet des liens locaux. On obtient une matrice de corrélation géographiquement pondérée, son R² local et la part locale de chaque facteur. La carte résultante révèle le facteur dont la part est la plus forte, en teinte pâle quand le R² local est faible. Le calcul porte sur dix facteurs au plus, les premiers du classement national. Les corrélations entre facteurs brouillent aussi les coefficients locaux d'une GWR multiple (Wheeler et Tiefelsdorf, 2005), d'où le choix de décomposer le R² plutôt que de comparer des coefficients. Le calcul a été vérifié en refaisant toutes les régressions possibles par moindres carrés pondérés.</p>
    <p>Ce sont des associations entre territoires, pas des causes. La part d'un facteur dépend des autres facteurs retenus. L'autocorrélation spatiale rend les tests habituels trop optimistes, c'est pourquoi aucune probabilité n'est affichée.</p>

    <h3>10. La double peine</h3>
    <p>Corrélations, pentes et facteurs concernent l'association entre deux désavantages, mais ne disent pas où ils se cumulent. Une pente positive colore de la même façon une commune aisée et peu exposée et une commune pauvre et polluée, puisque les deux suivent la même relation. L'onglet « Double peine » revient donc aux niveaux au sein des variables. Pour chacun des deux indicateurs, un territoire est jugé défavorable s'il fait partie du tiers de la population la plus défavorisée, d'après les rangs de population (ou du quart, ou des 20 %, au choix). On obtient donc quatre classes. Le rouge foncé marque les territoires défavorables pour les deux, c'est-à-dire le cumul d'une vulnérabilité sociale et d'une exposition au cœur des travaux sur la justice environnementale (Walker, 2012 ; Padilla et al., 2014).</p>
    <p>La part de la population dans cette case est comparée à celle qu'on attendrait si les deux désavantages étaient répartis indépendamment, le produit des deux parts, environ un neuvième pour des tiers. Un rapport supérieur à 1 signale une inégalité d'exposition, les plus défavorisés étant surreprésentés parmi les plus exposés. Les rangs comparent les territoires entre eux, mais il convient de garder en tête que le tiers le plus exposé n'est pas forcément au-dessus d'un seuil sanitaire.</p>
    <p>Les cartes bivariées en neuf classes sont difficiles à lire, car le lecteur doit décoder deux variables visuelles à la fois. La carte s'en tient donc à quatre classes, ordonnées par la valeur selon les règles de sémiologie graphique de Bertin (1967). La double peine prend la couleur la plus foncée, les deux désavantages isolés une valeur moyenne et deux teintes différentes, et le reste est presque effacé.</p>

    <h2>Limites</h2>
    <ul>
      <li>Les indicateurs décrivent des territoires et non des individus. On ne peut pas transposer à l'échelle des individus un résultat établi à une échelle agrégée (erreur écologique).</li>
      <li>Le secret statistique empêche l'Insee de publier le taux de pauvreté et le niveau de vie des plus petites communes. Elles reçoivent la valeur de leur intercommunalité, signalée par un astérisque.</li>
      <li>Les concentrations de polluants sont celles que l'Ineris estime pour chaque commune en combinant les stations de mesure et le modèle CHIMERE, sur la même méthode que sa reconstitution historique (Real et al., 2022). La carte fait la moyenne des trois dernières années, pour atténuer l'effet de la météo d'une année. Ce sont des concentrations de fond et des moyennes communales. Elles ne disent rien des écarts entre une rue passante et un quartier calme, ni des expositions sur le lieu de travail.</li>
      <li>Le nombre d'arrêtés de catastrophe naturelle dépend aussi des démarches des communes, qui doivent en faire la demande. Il mesure les catastrophes reconnues plus que les catastrophes subies, et il mêle des risques très différents (inondations, sécheresses, mouvements de terrain). C'est pourquoi il n'est proposé qu'en indicateur supplémentaire. Le détail par type, dans la fiche, reste approximatif. Dans la base, un même phénomène porte parfois plusieurs noms, et certains arrêtés regroupent plusieurs phénomènes, sans que ces regroupements soient toujours les mêmes. Les types sont donc reconnus dans le libellé de chaque arrêté, qui compte dans chacun de ceux qu'il mentionne.</li>
      <li>La population en zone inondable est celle de l'enveloppe approchée des inondations potentielles, publiée par l'Observatoire national des risques naturels. Cette enveloppe donne la limite maximale des zones qui pourraient être inondées, et non le risque d'une crue donnée. Elle surestime donc l'exposition réelle. Les parts exposées aux débordements de cours d'eau et à la submersion marine sont additionnées, ce qui compte deux fois les rares habitants exposés aux deux. Les tempêtes et le retrait-gonflement des argiles ne sont pas encore pris en compte, mais c'est un chantier en cours.</li>
      <li>L'abstention n'est pas toujours subie. Elle peut être un choix, et elle reflète aussi l'âge et la mobilité des habitants (Braconnier et Dormagen, 2007). Elle reste un bon indice de l'éloignement d'une partie de la population de la vie politique.</li>
      <li>Les sites Seveso sont comptés dans la commune où ils se trouvent. Une commune voisine peut être tout aussi exposée.</li>
      <li>L'indice européen de défavorisation (EDI) est publié par IRIS, à partir du recensement de 2021 (Pornet et al., 2012). La valeur d'une commune est la moyenne de ses IRIS, qui comptent chacun environ 2 000 habitants.</li>
      <li>L'indice SCALe diffusé en données ouvertes a été calculé avec les équipements de santé recensés en 2013, et des distances à vol d'oiseau (Launay et al., 2019). Une version plus récente fondée sur les distances par la route existe (Launay et al., 2024), mais elle n'est pas en accès libre. Il décrit donc une situation un peu ancienne. Il est utile pour vérifier ce que montre l'APL, construite autrement.</li>
      <li>L'emploi salarié privé ne compte ni les fonctionnaires, ni les indépendants, ni les salariés agricoles. Une commune qui comptait moins de 50 salariés au départ reçoit l'évolution de son intercommunalité, car un seul établissement y ferait varier fortement le chiffre. Les déménagements d'établissements d'une commune à une autre peuvent aussi créer des évolutions trompeuses.</li>
      <li>Une population qui diminue n'est pas toujours un désavantage pour ceux qui restent. Elle signale pourtant souvent une perte de services et d'activité.</li>
      <li>L'indice comparatif de mortalité rapporte les décès domiciliés des dix dernières années aux décès attendus. Ceux-ci sont calculés année par année, d'après la population de la commune cette année-là, la structure par âge et par sexe du dernier recensement et la mortalité nationale par âge et par sexe de la même année. Dans une petite commune, quelques décès de plus ou de moins changent beaucoup l'indice. Il est donc lissé par la méthode bayésienne empirique (Marshall, 1991), qui le rapproche de la moyenne nationale d'autant plus que les décès attendus sont peu nombreux. Aux autres niveaux géographiques, l'indice n'est pas une moyenne des communes. Il est recalculé à partir de la somme des décès observés et de la somme des décès attendus de chaque territoire. Les communes qui accueillent un grand établissement pour personnes âgées peuvent paraître en surmortalité.</li>
      <li>Les trajectoires longues reposent sur les données communales réunies par Julia Cagé et Thomas Piketty (2023). Elles comparent le rang d'une commune la première et la dernière année où la variable est connue pour la plupart des communes, années indiquées dans le nom de l'indicateur. Ce choix neutralise l'inflation et la croissance générale. Les communes qui ont fusionné entre-temps reçoivent la valeur de leur intercommunalité.</li>
      ${indic("prematuree") && indic("prematuree").unite !== "taux" ? `<li>L'Insee ne publie pas les décès par âge et par commune de domicile. La mortalité prématurée vient donc de l'Observatoire des territoires, ${indic("prematuree").unite.includes("département") ? "par département" : "par intercommunalité"}. Toutes les communes d'un même territoire ont la même valeur, ce qui atténue ses liens avec les autres indicateurs à l'échelle communale. Mieux vaut la comparer aux autres à l'échelle des intercommunalités.</li>` : ""}
      <li>Le taux de chômage vient du recensement, où chacun déclare sa situation. Il diffère du taux de chômage au sens du Bureau international du travail, plus restrictif, que l'Insee ne publie que par zone d'emploi. Dans les petites communes, il repose sur peu d'actifs et varie beaucoup d'un recensement à l'autre.</li>
      <li>Les nuits chaudes sont comptées sur la grille de 8 km de la réanalyse Safran de Météo-France (Vidal et al., 2010). Elles décrivent le climat régional, plus chaud au sud et dans les vallées, mais pas l'îlot de chaleur urbain. Or c'est la nuit que l'écart entre un centre-ville et sa campagne est le plus fort, et il pèse surtout sur les logements denses, mal isolés et peu végétalisés. Cet écart, faute de mesure homogène à l'échelle nationale, n'est pas pris en compte.</li>
      ${indic("ift") ? `<li>L'IFT de la carte Adonis est une estimation, qui applique à chaque commune les pratiques moyennes de sa région pour ses cultures (Solagro, 2024a). Il décrit l'intensité des traitements sur les terres cultivées et non leur étendue, si bien qu'une commune presque sans champs peut avoir un IFT élevé. Les communes sans terres cultivées n'ont pas de valeur. ${ADONIS.mention}. La carte d'utilisation des pesticides se consulte sur la ${lien(ADONIS.lien, "plateforme Adonis")}.</li>` : ""}
      <li>Les analyses portent sur l'eau distribuée, prélevée sur les réseaux de distribution après traitement et mélange éventuel des ressources, et non sur l'eau brute des forages ou des rivières. Elles mesurent donc ce que boivent réellement les habitants. Mais chaque agence régionale de santé choisit les molécules qu'elle recherche, ce qui crée des écarts entre départements, et des métabolites très répandus n'ont longtemps été recherchés nulle part (Anses, 2023). Les petits réseaux sont rarement contrôlés. Une commune sans contrôle pendant la période reçoit la valeur de son intercommunalité. Les métabolites que l'Anses a classés non pertinents, comme le R471811 du chlorothalonil ou ceux du métolachlore et du métazachlore, n'ont plus de limite de qualité et ne comptent plus dans le total officiel. Mais dans les analyses antérieures à leur reclassement, ils avaient encore la limite de 0,1 µg/L et entraient dans ce total. La carte refait donc la somme de chaque prélèvement en appliquant à toute la période la classification la plus récente. Une substance qui n'a plus de limite de qualité dans les dernières analyses n'est comptée dans aucune année. Les limites de qualité ne sont d'ailleurs pas des seuils sanitaires. Seul le dépassement des valeurs sanitaires propres à chaque molécule conduit à restreindre l'usage de l'eau.</li>
      <li>Les distances au lycée et aux formations post-bac partent du centre des carreaux habités de 1 km du recensement, ce qui situe les habitants à quelques centaines de mètres près. Les plus petites communes, sans centre de carreau sur leur territoire, sont mesurées depuis un point situé à l'intérieur de leurs limites. Ces distances sont à vol d'oiseau. Elles sous-estiment les trajets en montagne et ne disent rien des transports disponibles. La formation la plus proche n'est pas forcément celle qu'un jeune souhaite suivre, et un BTS voisin ne remplace pas une université.</li>
      <li>La ségrégation entre collèges est calculée à l'intérieur de chaque intercommunalité. Elle ignore les élèves scolarisés dans une intercommunalité voisine, ce qui est fréquent dans le privé. Elle n'est pas mesurable quand le territoire n'a qu'un collège. Ses communes reçoivent alors la valeur de leur zone d'emploi, une échelle plus large que celle des autres communes. L'IPS repose sur les professions déclarées par les familles, et la DEPP conseille de ne pas interpréter des écarts de trois points ou moins entre deux collèges.</li>
      <li>D'autres dimensions importantes manquent encore, faute de données ouvertes et systématiques à la commune, comme l'incidence des maladies, le bruit, l'îlot de chaleur urbain, l'accès aux transports ou les dotations de l'État.</li>
    </ul>

    <h2>Auteur et contributions</h2>
    <p>${AUTEUR}.</p>
    <p>Le code de cet outil (écrit en R et en JavaScript) a été rédigé avec l'aide de l'IAG (Claude, Anthropic). Les analyses automatiques des cartes (« Ce que dit la carte ») répondent au prompt suivant : « réalise une description des cartes en caractérisant le score cumulé par moitié du pays (nord, sud, est, ouest) puis décris les régions extrêmes ». La règle vaut aussi pour les dimensions, les indicateurs et la double peine. Une moitié du pays n'est décrite que si elle s'écarte nettement de la moitié opposée et que peu de régions la contredisent, régions qui sont alors citées comme exceptions. Sinon, le texte passe directement aux régions où la situation est la plus défavorable et la plus favorable, ainsi qu'à une région proche de la moyenne nationale. Les questions posées, le choix des méthodes et des indicateurs, la vérification des calculs et la relecture des textes relèvent de l'auteur, nourri des échanges avec les collègues remerciés ci-après, et il en assume l'entière responsabilité.</p>
    <p>L'auteur tient à remercier plusieurs collègues pour leurs contributions, suggestions et relectures : Julie Bulteau, Fabien Guillot, Jean-Michel Cador et Clémence Christin.</p>
    <p>Les remarques, corrections et propositions d'indicateurs sont les bienvenues, par <a href="mailto:${CONTACT}">courriel</a> ou sur le ${lien(DEPOT + "/issues", "dépôt GitHub")}.</p>`;
